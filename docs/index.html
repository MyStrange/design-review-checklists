<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Дизайн-ревью — чек-листы</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
/* Фон страницы чёрный — под стать иллюстрациям. Скроллится не страница,
   а содержимое белой рабочей области, поэтому у body скролла нет вовсе. */
body { background: #000; font-family: 'Golos Text', sans-serif; font-size: 15px; line-height: 1.5; height: 100%; overflow: hidden; display: flex; color: #1a1a1a; }
.sidebar { width: 250px; flex-shrink: 0; background: transparent; padding: 24px 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; }
/* Переключатель режимов: белая плашка, выбранная вкладка — чёрная внутри неё. */
.mode-toggle { display: flex; gap: 2px; margin: 0 16px 18px; background: #fff; border-radius: 999px; padding: 4px; }
.mode-btn { flex: 1; text-align: center; font-size: 14px; font-weight: 600; padding: 7px 8px; border-radius: 999px; cursor: pointer; color: #8A8A90; border: none; background: transparent; font-family: inherit; transition: all .12s; }
.mode-btn:hover { color: #1a1a1a; }
.mode-btn.active { background: #000; color: #fff; }
.sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6E6E73; padding: 0 20px; margin-bottom: 12px; }
.nav-item { margin: 1px 16px; padding: 8px 4px; cursor: pointer; transition: color .12s; }
.nav-item:hover .nav-main { color: #E4E4E8; }
/* Выбранный пункт ничем не обведён — его подсвечивает сам текст,
   тем же розовым, что и корона рядом. */
.nav-item.active .nav-main { color: #FF9DC9; }
.nav-item.active .nav-sub { color: rgba(255,157,201,.55); }
.nav-main { font-size: 14px; font-weight: 600; color: #F2F2F4; }
.nav-item:not(.active) .nav-main { color: #9A9AA2; font-weight: 500; }
.nav-sub { font-size: 12px; color: #6E6E73; margin-top: 1px; }
.nav-empty { padding: 10px 20px; color: #6E6E73; font-size: 13px; }
.nav-divider { height: 1px; background: rgba(255,255,255,.12); margin: 12px 16px 10px; }
/* Белая рабочая область — цельная карточка с одинаковыми полями со всех
   четырёх сторон. Снизу она не упирается в край экрана: вместо страницы
   скроллится её собственное содержимое. */
.main { position: fixed; top: 8px; right: 8px; bottom: 8px; left: 250px; margin: 0; background: #fff; border-radius: 24px; padding: 40px; overflow-y: auto; overscroll-behavior: contain; }
.sidebar::-webkit-scrollbar, .main::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-track, .main::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 999px; }
.main::-webkit-scrollbar-thumb { background: #DCE1E7; border-radius: 999px; }
.main-inner { max-width: 800px; }
/* у последнего блока гасим собственный отступ, чтобы снизу осталось ровно
   то же поле карточки, что и сверху */
.main-inner > :last-child { margin-bottom: 0; }
.session-header { margin-bottom: 28px; }
.session-meta { font-size: 12px; color: #999; margin-bottom: 6px; letter-spacing: 0.04em; }
h1 { font-size: 60px; font-weight: 600; color: #1a1a1a; letter-spacing: -0.02em; line-height: 1.05; }
.crown svg { height: 19px; width: auto; vertical-align: middle; margin-left: 6px; position: relative; top: -2px; }
.crown-h1 svg { height: 56px; width: auto; vertical-align: baseline; margin-left: 14px; position: relative; top: 8px; }
.status-badge { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 600; color: #fff; padding: 5px 13px; border-radius: 999px; }
.st-king { background: #1a1a1a; }
.st-product { background: #9b59b6; }
.st-dev { background: #3a7be0; }
.st-seo { background: #2e9e6b; }
.st-legal { background: #9a7b2e; }
.st-brand { background: #d6336c; }
.st-rare { background: #8a94a6; }
.st-regular { background: #5a78b0; }
.st-ux { background: #199AF0; }
.st-second { background: #7E8BA3; }
.st-multi { background: #2BA39A; }
/* Номинации встречи: четыре вертикальные карточки в ряд.
   Иллюстрации нарочно вылезают за верхний край карточки — как в макете,
   поэтому у сетки большой отступ сверху, а место под картинку в потоке
   занимает пустая коробка .fun-icon фиксированной высоты. */
.fun-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 76px 0 22px; }
.fun-card { position: relative; background: #fff; border: 1px solid #E8ECF1; border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; }
.fun-icon { position: relative; height: 44px; margin-bottom: 16px; }
.fun-icon svg { position: absolute; display: block; }
/* Размеры и сдвиги сняты с макета: картинка висит на нижнем крае коробки и уходит вверх за карточку. */
.fun-icon-weird_word svg { left: -5px; bottom: -4px; width: 100px; height: 119px; }
.fun-icon-catch_phrase svg { left: 18px; bottom: 0; width: 108px; height: 133px; }
.fun-icon-smart_comment svg { left: 18px; bottom: -13px; width: 153px; height: 138px; }
.fun-icon-filler_word svg { left: 35px; bottom: -6px; width: 106px; height: 135px; }
.fun-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #a7b0bd; margin-bottom: 8px; }
.fun-text { font-size: 15px; font-weight: 600; color: #1a1a1a; line-height: 1.35; }
/* умная мысль длиннее слова или фразы — ей свой кегль, чтобы влезала целиком */
.fun-text.long { font-size: 13px; font-weight: 500; line-height: 1.45; }
.fun-text.longer { font-size: 12px; font-weight: 500; line-height: 1.5; }
.fun-list { display: flex; flex-direction: column; gap: 7px; }
.fun-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.fun-word { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.fun-num { font-size: 12px; color: #a7b0bd; white-space: nowrap; }
.fun-total { font-size: 12px; color: #a7b0bd; margin-top: auto; padding-top: 14px; }
.fun-context { font-size: 12px; color: #a7b0bd; line-height: 1.4; margin-top: 8px; }
.fun-meta { font-size: 12px; color: #a7b0bd; margin-top: auto; padding-top: 14px; }
.card-date { font-size: 12px; font-weight: 600; color: #999; margin: 22px 0 8px 2px; }
.card-date:first-child { margin-top: 0; }
.project { background: #fff; border: 1px solid #E8ECF1; border-radius: 20px; margin-bottom: 14px; overflow: hidden; }
.project-header { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; gap: 12px; }
.project-header:hover { background: #F6F8FA; }
.author { font-size: 15px; font-weight: 600; color: #1a1a1a; }
.project-name { font-size: 13px; color: #999; margin-top: 1px; }
.project-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.count { font-size: 13px; color: #bbb; font-weight: 500; }
.count.done { color: #E10D87; }
.chevron { color: #ccc; font-size: 11px; transition: transform 0.2s; }
.project.collapsed .chevron { transform: rotate(-90deg); }
.project.collapsed .tasks { display: none; }
.tasks { border-top: 1px solid #EEF1F4; }
.task { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #EEF1F4; cursor: pointer; }
.task:last-child { border-bottom: none; }
.task:hover { background: #F6F8FA; }
.checkbox { width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid #CFD6DE; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all .15s; background: #fff; }
.task.checked .checkbox { background: #C6F707; border-color: #C6F707; }
.task.checked .checkbox::after { content: ''; width: 4px; height: 8px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-top: -2px; }
.task-text { font-size: 14px; color: #333; flex: 1; padding-top: 1px; }
.task.checked .task-text { color: #bbb; text-decoration: line-through; text-decoration-color: #ccc; }
.tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-left: 6px; vertical-align: middle; position: relative; top: -1px; }
.tag.ux { color: #e07b3a; background: #fef0e6; }
.tag.dev { color: #3a7be0; background: #e6effe; }
.tag.discuss { color: #9b59b6; background: #f5edfc; }
.tag.product { color: #9b59b6; background: #f5edfc; }
.tag.seo { color: #2e9e6b; background: #e6f7ee; }
.tag.legal { color: #9a7b2e; background: #f6efdc; }
.tag.branding { color: #d6336c; background: #fde8ef; }
.placeholder { color: #bbb; text-align: center; padding: 80px 20px; }
.reset-btn { position: fixed; bottom: 24px; right: 24px; background: #fff; border: 1px solid #E2E7EC; color: #999; font-family: 'Golos Text', sans-serif; font-size: 12px; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all .15s; }
.reset-btn:hover { color: #555; border-color: #bbb; }
@media (max-width: 1000px) {
  /* в два столбца картинкам верхнего ряда нужен зазор, иначе они лягут на карточку выше */
  .fun-grid { grid-template-columns: repeat(2, 1fr); row-gap: 76px; }
}
@media (max-width: 640px) {
  /* на узком экране карточка снова тянется по содержимому, скроллит страница */
  body { flex-direction: column; height: auto; overflow: auto; }
  .sidebar { width: 100%; position: static; padding: 12px 0; border-radius: 0; }
  .mode-toggle { margin: 0 12px 10px; }
  .sidebar-title { display: none; }
  #nav-list { display: flex; overflow-x: auto; gap: 4px; padding: 0 8px; }
  .nav-item { flex-shrink: 0; border-left: none; border-bottom: 2px solid transparent; padding: 6px 10px; }
  .main { position: static; margin: 8px; padding: 24px 16px; overflow: visible; border-radius: 20px; }
  .fun-grid { grid-template-columns: 1fr; row-gap: 76px; }
  h1 { font-size: 38px; }
}
</style>
</head>

<script>
const DATA = {"sessions": [{"id": "s20261110p1i0", "date": "2026-11-10", "dateLabel": "10 ноября", "meta": "10 ноября 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {"weird_word": {"text": "кринжатура", "author": "Рома", "context": "Лестница тут появляется очень странная. — Кринжатура, да"}, "catch_phrase": {"text": "записался через нас", "author": "Кариша", "count": 4}, "smart_comment": {"text": "Самое логичное и правильное — подтверждение по транзакции: 2GIS ловит данные о том, что ты оплачивал картой в этом заведении, и ставит пометку на отзыв. Если научимся так же, это снимет всю сложную логику подтверждений и ручной труд.", "author": "Глеб"}, "filler_word": {"items": [{"text": "вот", "count": 275}, {"text": "ну", "count": 107}, {"text": "просто", "count": 69}], "total": 657}}, "projects": [{"id": "s20261110p1i0-0-0", "author": "Надя", "title": "Карточка врача телемеда", "tasks": [{"id": "bdfca27af597", "text": "Поменять местами цену и блок «прием только онлайн».", "tag": "ux"}, {"id": "65b6a3338066", "text": "Переработать иконку телемеда — сейчас она напоминает дизлайк или боксерскую перчатку, не очевидно, что это камера.", "tag": "ux"}, {"id": "a7d7fd32ea05", "text": "Подумать над цветом текста «прием только онлайн», чтобы не путать с синими ссылками.", "tag": "ux"}]}, {"id": "s20261110p1i0-1-0", "author": "Кариша", "title": "Раздел отзывов в ЛК клиник", "tasks": [{"id": "44c9cb650828", "text": "Убрать текстовое значение рейтинга — оставить только цифру.", "tag": "ux"}, {"id": "c5af2a795f31", "text": "Уточнить, не создают ли серые табы ощущение задизейбленных элементов.", "tag": "ux"}, {"id": "372cdea86b92", "text": "Уточнить возможность изменения цвета сайдбара.", "tag": "ux"}, {"id": "5104db5adc28", "text": "Показать, как выглядит скрытие длинных или коротких отзывов.", "tag": "ux"}, {"id": "7d51e2ccb09d", "text": "Увеличить отступ для ответа клиники, чтобы показать вложенность и иерархию — как на сайте.", "tag": "ux"}, {"id": "4cbbc0b2b854", "text": "Поресерчить варианты иконок для фильтра с датой, так как текущие залитые выглядят плохо.", "tag": "ux"}, {"id": "318daf1ec32b", "text": "Оставить иконки в фильтрах залитыми, а не контурными.", "tag": "ux"}, {"id": "2013681adc72", "text": "Выяснить с Егором причину расхождения в отображении тире между Figma и Storybook.", "tag": "dev"}, {"id": "3398c17392c7", "text": "Добавить пояснение о механике сбора отзывов до отправки заявки.", "tag": "ux"}, {"id": "96bcf383069b", "text": "Рассмотреть добавление отдельной кнопки «Подробнее» для ознакомления с информацией о сборе отзывов.", "tag": "ux"}, {"id": "f9cb4eb2443c", "text": "Поработать над текстом кнопки или баннера, чтобы было понятно, что после клика откроется форма с информацией.", "tag": "ux"}, {"id": "86309c382e4e", "text": "Добавить короткие правила оформления ответов на отзывы.", "tag": "ux"}, {"id": "388907fa876b", "text": "Инициировать обсуждение с продуктами и аналитиками по изменению логики многоуровневого подтверждения отзывов.", "tag": "ux"}, {"id": "0036b5bbbce6", "text": "Узнать у продуктов о возможности получения данных из МИС для подтверждения отзывов.", "tag": "ux"}, {"id": "2be66b04534c", "text": "Привести в порядок и автоматизировать процесс подтверждения отзывов.", "tag": "ux"}, {"id": "8aa5bd63ae9e", "text": "Уточнить, важно ли время оставления отзыва для выявления фейковых отзывов.", "tag": "ux"}, {"id": "9e9f5477f0f5", "text": "Уточнить, когда отзыв появляется в ЛК клиники — сразу после написания или после модерации.", "tag": "ux"}, {"id": "e214be020431", "text": "Уточнить, нужна ли дата модерации отзыва в ЛК клиники.", "tag": "ux"}, {"id": "a8d40c9b6fe3", "text": "Уточнить, какую проблему для клиники решает отображение даты написания или модерации отзыва.", "tag": "ux"}, {"id": "2122f6645870", "text": "Пересмотреть процесс подтверждения отзывов с помощью рукописных согласий, так как он абсурден.", "tag": "ux"}, {"id": "0b6d8295ec83", "text": "Выводить имя пациента в списке отзывов, если оно указано.", "tag": "ux"}, {"id": "92fec477905b", "text": "Уточнить у Саши, для чего нужен номер заявки и стоит ли его выводить в общем списке отзывов.", "tag": "ux"}, {"id": "e5fe5887b23e", "text": "Подумать, как помечать отзывы пользователей, записавшихся через сервис, чтобы показать, что они уже подтверждены.", "tag": "ux"}, {"id": "5696525bc9d7", "text": "Выяснить, как отображается на фронте урегулирование конфликтов между клиникой и пациентом, если оно происходит.", "tag": "ux"}]}]}, {"id": "s20261105p2i1", "date": "2026-11-05", "dateLabel": "5 ноября", "meta": "5 ноября 2026 · Ревью ч.2 · чт", "designersCount": 2, "fun": {"weird_word": {"text": "задушниться", "author": "Кариша", "context": "Ну, я тебе, может, потом зайду задушниться — мне интересно, как это вообще происходит"}, "catch_phrase": {"text": "бегущая строка на док-доке", "author": "Надя", "count": 2}, "smart_comment": {"text": "К баннерам нужна единая логика: чтобы они были одинаково свёрстаны и одинаково выглядели, а под каждую хотелку продукта не приходилось придумывать кастом. Иначе владение баннерами станет бесконтрольным и они вечно будут разными.", "author": "Олег"}, "filler_word": {"items": [{"text": "вот", "count": 195}, {"text": "ну", "count": 74}, {"text": "то есть", "count": 61}], "total": 525}}, "projects": [{"id": "s20261105p2i1-0-0", "author": "Егор", "title": "Новая дизайн-система Nexa", "tasks": [{"id": "5dd7278e71a4", "text": "Предложить альтернативные названия для дизайн-системы", "tag": "ux"}, {"id": "66845a7e3fdf", "text": "Синхронизироваться по использованию компонента «цена» с зачеркиванием", "tag": "ux"}, {"id": "00ee4c6206c1", "text": "Добавить опцию для серого цвета зачеркнутой цены", "tag": "ux"}, {"id": "8dbea6170adc", "text": "Исправить цвет зачеркнутой цены, чтобы он не становился коричневым", "tag": "ux"}, {"id": "9073193dd0ac", "text": "Уточнить сроки выкатки новой дизайн-системы для планирования работы с макетами", "tag": "ux"}, {"id": "6f2eab8aa56d", "text": "Уточнить срок текстом и меняющимся заголовком, не встраивая кнопку в большой прямоугольник", "tag": "ux"}, {"id": "72bcff5b00c6", "text": "Рассмотреть использование элемента «тест на беременность» вместо «соски»", "tag": "ux"}]}]}, {"id": "s20261103p1i2", "date": "2026-11-03", "dateLabel": "3 ноября", "meta": "3 ноября 2026 · Ревью ч.1 · вт", "designersCount": 1, "fun": {"weird_word": {"text": "переконцепчу", "author": "Олег", "context": "Я дальше чуть-чуть так это прям приподниму некоторые штуки, может быть, сильно переконцепчу"}, "catch_phrase": {"text": "на рабочий стол", "author": "Олег", "count": 2}, "smart_comment": {"text": "Одно из важных целевых действий — прямо сказать человеку: нажми share на айфоне и сохрани сервис на рабочий стол. Иначе он запоминает домен, заходит через Сберхелс, авторизуется — и такой возврат ничем не поддержан.", "author": "Олег"}, "filler_word": {"items": [{"text": "вот", "count": 229}, {"text": "типа", "count": 87}, {"text": "ну", "count": 82}], "total": 686}}, "projects": [{"id": "s20261103p1i2-0-0", "author": "Костя", "title": "Сервис «Хроники»", "tasks": [{"id": "1c2beddf2f31", "text": "Убрать градиент на заднем фоне, оставить серую подложку.", "tag": "ux"}, {"id": "2924c1540116", "text": "Убрать навигацию сверху.", "tag": "ux"}, {"id": "88f7a261c829", "text": "Разделить карточку с набором анализов на несколько.", "tag": "ux"}, {"id": "29472f2b6309", "text": "Сделать кнопку «Начать контроль» стики.", "tag": "ux"}, {"id": "908ce1366e27", "text": "Сделать акцент на сохранение PWA на рабочий стол.", "tag": "ux"}, {"id": "9638d21bd9a0", "text": "Объединить экраны выбора заболеваний и набора анализов, сократив количество шагов.", "tag": "ux"}, {"id": "a2beb0fd2a8c", "text": "Продумать флоу авторизации, чтобы она была бесшовной и контекстной.", "tag": "ux"}, {"id": "dc987f713c33", "text": "Экспериментировать с местом размещения авторизации в флоу.", "tag": "ux"}, {"id": "455d36a5d5c5", "text": "Встроить авторизацию в UI флоу нативно, без отрыва.", "tag": "ux"}, {"id": "b6ad84cc0568", "text": "Раскрыть больше информации о проблеме хронических заболеваний и решении сервиса на лендинге.", "tag": "ux"}, {"id": "6d88626d6d53", "text": "Убрать информацию про «1800 лабораторий» с лендинга.", "tag": "ux"}, {"id": "d2361547a7f1", "text": "Подсветить функцию напоминаний как полезную.", "tag": "ux"}, {"id": "6dd3968b3d79", "text": "Пересмотреть иконки у заболеваний — они ломают верстку, возможно, убрать их.", "tag": "ux"}, {"id": "6d96d44e100f", "text": "Уменьшить вложенность элементов на экране, чтобы избежать «зебры» из серого и белого фона.", "tag": "ux"}, {"id": "0abd807478e2", "text": "Рассмотреть вариант интеграции выбора заболеваний прямо в лендинг.", "tag": "ux"}, {"id": "eb8812e2e4e1", "text": "Уточнить логику кнопки «Оформить анализы 4», когда не все анализы видны на экране.", "tag": "ux"}, {"id": "cbf3cb3362f8", "text": "Уточнить, к чему относится кнопка «Оформить анализы», когда есть блок «Мои показатели» и пустой экран.", "tag": "ux"}, {"id": "bb9316db95b0", "text": "Унифицировать стили кнопок внизу экрана: «добавить», «показать все», «оформить», «сбросить контроль».", "tag": "ux"}, {"id": "622dcc6b8a03", "text": "Убрать плашку с фона, так как много визуальных элементов.", "tag": "ux"}, {"id": "76d313e8bfdb", "text": "Упростить шапку, убрав лишние элементы (бонусы, промокод, смена города).", "tag": "ux"}, {"id": "c58dbd7ae88a", "text": "Рассмотреть возможность использования фуллскрин-флоу, как в риск-профиле, с сохранением состояния.", "tag": "ux"}, {"id": "fd8bb0bb0806", "text": "Использовать существующий паттерн хедера: кнопка «назад» слева, логотип по центру, кнопка «поиск» справа.", "tag": "ux"}, {"id": "19487dfa11ee", "text": "Заменить кнопку «Показать все» для анализов на горизонтальный свайп, если анализов немного.", "tag": "ux"}, {"id": "9a2fee16338b", "text": "Для выбора заболеваний рассмотреть механику горизонтального скролла с сокращенным списком, раскрывающимся при дальнейшем свайпе, вместо чипсов для длинных названий.", "tag": "ux"}, {"id": "0ac08493a7a6", "text": "Попробовать сокращенные версии названий заболеваний в табах.", "tag": "ux"}, {"id": "77b48c8bcdb3", "text": "Превратить «И помощник» в простую кнопку.", "tag": "ux"}, {"id": "1155912a02d1", "text": "Продумать блок «Загрузить PDF и фото», найти примеры реализации.", "tag": "ux"}, {"id": "aeab16cbe7ce", "text": "Улучшить понятность блока с календарем «Расписание сдачи анализов».", "tag": "ux"}, {"id": "b05319c98be9", "text": "Поднять блок «Следующая задача анализов в этом месяце» выше, так как это главный призыв к действию.", "tag": "ux"}, {"id": "78d3c70a4f5b", "text": "Унифицировать стили по всему экрану, слишком много разных стилей.", "tag": "ux"}, {"id": "6c318cc3f912", "text": "Убрать ненужные иконки, например, у «Настроить напоминания».", "tag": "ux"}, {"id": "2e67354b3e43", "text": "Пересмотреть необходимость фильтрации рядом с «Мои показатели».", "tag": "ux"}, {"id": "f5501d8aeecd", "text": "Изучить реализацию в «Вижене» для объединения элементов.", "tag": "ux"}, {"id": "ceadcd0ea404", "text": "Переосмыслить переключение между заболеваниями: предложить общий summary feed с краткими выводами и возможностью провалиться в детали.", "tag": "ux"}, {"id": "eae141534fe0", "text": "Предложить новую структуру: главный CTA, блоки с кратким обзором по заболеваниям, плавающая кнопка ИИ-помощника.", "tag": "ux"}, {"id": "45465d418a7a", "text": "Поднять видимость и удобство ключевых действий: «доздать анализы», «написать врачу», «написать ИИ-помощнику».", "tag": "ux"}, {"id": "f14be27ffe95", "text": "Обсудить необходимость разделения показателей по болезням.", "tag": "ux"}, {"id": "4ed684aa2ed9", "text": "Интегрировать рекомендации врачей с конкретными результатами анализов, чтобы была понятна причинно-следственная связь.", "tag": "ux"}, {"id": "e7555ac33851", "text": "Переработать визуальное оформление красного блока «Резко ухудшилось состояние», чтобы он не выглядел как ошибка.", "tag": "ux"}, {"id": "6a94004d96b5", "text": "Улучшить контрастность и визуальную ясность красного блока «Резко ухудшилось состояние».", "tag": "ux"}, {"id": "967855b889f7", "text": "Уточнить, является ли «Экстренная связь с врачом онлайн» действительно экстренной или это дежурный врач.", "tag": "ux"}, {"id": "9bb2c26abb88", "text": "Объяснить, почему рекомендуется именно этот специалист при ухудшении показателей.", "tag": "ux"}, {"id": "1250886f8db6", "text": "Уточнить действие кнопки «Сдать анализы» — куда она ведет, останется ли пользователь на текущей странице.", "tag": "ux"}, {"id": "f0294260c36b", "text": "Избегать дублирования количества анализов в тексте и на кнопке «Сдать анализы».", "tag": "ux"}, {"id": "97a850649848", "text": "Разделить действия «раскрыть список анализов» и «добавить в корзину» для блока «Следующая сдача анализов».", "tag": "ux"}, {"id": "50d40acc4c1e", "text": "Упростить текст и, возможно, использовать только иконку для «Загрузить PDF и фото».", "tag": "ux"}, {"id": "d9b5295d3dc4", "text": "Сократить блок «Анализы в контроле» до сводки с ссылкой на модалку для редактирования.", "tag": "ux"}, {"id": "336b254cbdd4", "text": "Сделать блок «Резко ухудшилось состояние» более нейтральным, например, «Связь с врачом онлайн».", "tag": "ux"}, {"id": "318d5d702e9f", "text": "Рассмотреть использование нижнего таб-бара для навигации по сервису, чтобы разгруппировать длинную страницу.", "tag": "ux"}, {"id": "25b73459df83", "text": "Вынести «Список анализов» и «И помощник» в отдельные иконки в нижнем таб-баре.", "tag": "ux"}, {"id": "89b9b0c052e1", "text": "Объединить функцию загрузки и расшифровки результатов анализов с ИИ-помощником.", "tag": "ux"}]}]}, {"id": "s20261029p2i3", "date": "2026-10-29", "dateLabel": "29 октября", "meta": "29 октября 2026 · Ревью ч.2 · чт", "designersCount": 3, "fun": {"weird_word": {"text": "помойка", "author": "Надя", "context": "У нас на сайте достаточно большая помойка: ещё есть вот такие кэшбэки, какие-то вот такие кэшбэки"}, "catch_phra bffb0", "text": "Убрать крестик, оставить одну кнопку действия", "tag": "ux"}, {"id": "b4fb764c0bbf", "text": "Продумать флоу возврата после заказа анализов", "tag": "ux"}, {"id": "3e3d3b2bfb25", "text": "Уточнить техническую реализацию открытия модалки - поверх чего она отображается", "tag": "dev"}, {"id": "afe18d3885df", "text": "Упростить логику отображения модалки, учесть сложности на десктопе", "tag": "ux"}, {"id": "d2e3d8ee01f5", "text": "Рассмотреть вариант сделать экран успеха обычной страницей с визуализацией модалки", "tag": "ux"}, {"id": "022da8ad5333", "text": "Определить, что должно отображаться под модалкой при ее закрытии", "tag": "ux"}, {"id": "82ca50d8c543", "text": "Уточнить возможность отображения главной страницы под модалкой", "tag": "dev"}, {"id": "e1d0a74b2d46", "text": "Избежать 'ржаки' в динамике при загрузке главной и открытии модалки", "tag": "dev"}, {"id": "925b3ad32f5d", "text": "Не делать отдельную кнопку 'На главную'", "tag": "ux"}, {"id": "6f8bc91d7f3e", "text": "Сделать экран успеха обычной страницей", "tag": "ux"}, {"id": "f3d1d66ccfbb", "text": "Отобразить экран успеха как обычную страницу с элементами UI, без затемнения", "tag": "ux"}, {"id": "a37c683f4ffc", "text": "Добавить тени или серый фон для плашки экрана успеха", "tag": "ux"}, {"id": "697d228ab378", "text": "Доработать отображение на десктопе, чтобы не было пустоты", "tag": "ux"}, {"id": "982c106d3194", "text": "Добавить шапку, навигацию и футер на экран успеха для десктопа", "tag": "ux"}, {"id": "d51413e8a8d7", "text": "Пересмотреть необходимость крестика на экране успеха", "tag": "ux"}, {"id": "980dad90636e", "text": "Избежать редиректа по крестику, если он останется", "tag": "ux"}, {"id": "01ba87e46d3f", "text": "Оставить навигацию для возврата на главную", "tag": "ux"}, {"id": "5e53978d1f66", "text": "Обеспечить целевое действие после экрана успеха - переход на страницу заказа или баннер", "tag": "ux"}, {"id": "dbd05f1ff74d", "text": "Уменьшить ширину модалки на десктопе", "tag": "ux"}, {"id": "9a6858429439", "text": "Найти оптимальную ширину модалки, чтобы избежать пустоты и одиноких элементов", "tag": "ux"}, {"id": "a07c8e4f1598", "text": "Встроить экран успеха в структуру сайта - убрать крестик, добавить шапку, футер, навигацию", "tag": "ux"}, {"id": "8dd5e22d9093", "text": "Исправить тени, чтобы скрепка не сливалась с фоном", "tag": "ux"}, {"id": "53a7cf1ad67a", "text": "При растягивании экрана держать форму ближе к кнопке с фиксированным расстоянием", "tag": "ux"}, {"id": "9234f37ad50c", "text": "Не выносить логотип посередине над модалкой, чтобы не ломать навигацию", "tag": "ux"}]}, {"id": "s20260929p1i6-0-1", "author": "Костя", "title": "Табар", "tasks": [{"id": "7b1034892162", "text": "Использовать залитые иконки в табаре", "tag": "ux"}, {"id": "b630282ef92d", "text": "Обновить иконку 'Главная' на новую", "tag": "ux"}, {"id": "c264df839423", "text": "Не делать сильный акцент на выбранном пункте табара, если это не промо-элемент", "tag": "ux"}, {"id": "bab5df08d856", "text": "Оставить подписи под иконками в табаре", "tag": "ux"}, {"id": "a3bac2f5d4e1", "text": "Переделать иконки в табаре на залитые, соответствующие концепту", "tag": "ux"}, {"id": "dbf6673c0af4", "text": "Внести табар в дизайн-систему", "tag": "dev"}, {"id": "47e5552bab1a", "text": "Добавить иконки для корзины, результатов и т.д. в компонент табара дизайн-системы", "tag": "dev"}, {"id": "7d2b61e2f592", "text": "Обеспечить единые размеры, формат, отступы и утвержденный набор иконок для табара", "tag": "ux"}, {"id": "2aba5406121e", "text": "Оставить только один вариант иконки 'Домик' в дизайн-системе", "tag": "ux"}, {"id": "43c242aef637", "text": "Удалить дублирующие иконки 'Home' из дизайн-системы", "tag": "ux"}]}, {"id": "s20260929p1i6-1-0", "author": "Ксюша", "title": "Сдача анализов на дому (Корзина)", "tasks": [{"id": "481ca664a617", "text": "Использовать табы для выбора способа сдачи анализов - мед-офис/на дому", "tag": "ux"}, {"id": "c9969b95ef09", "text": "Добавить поле для ввода адреса при выборе 'на дому' или явно объяснить механику", "tag": "ux"}, {"id": "c6191139cdca", "text": "Уточнить у продакта дальнейшие шаги по фиче 'на дому' и текстовки", "tag": "ux"}, {"id": "c3b3353cb13e", "text": "Пересмотреть отображение названия лаборатории и общую гармонию текстов во флоу", "tag": "ux"}, {"id": "47116e61035e", "text": "Пересмотреть подход к тестированию фичи 'на дому' для получения более показательных результатов", "tag": "ux"}, {"id": "5f7d88862615", "text": "Добавить поле для ввода адреса как комментарий, даже если его обрабатывает оператор", "tag": "ux"}, {"id": "ad9ec6156bce", "text": "Добавить онбординг-подсказку при первом выборе 'на дому', объясняющую механику", "tag": "ux"}, {"id": "f07cde33bf23", "text": "Не открывать онбординг-подсказку автоматически, только по осознанному выбору", "tag": "ux"}, {"id": "4106ad67e77c", "text": "Применить стилистику онбординга из концепта Глеба", "tag": "ux"}, {"id": "f50e82321b3a", "text": "Не добавлять иконки к табам выбора способа сдачи, оставить текстом", "tag": "ux"}, {"id": "2905703d48b0", "text": "Исправить отступы и выравнивание элемента выбора города в корзине", "tag": "ux"}, {"id": "2d38f3019304", "text": "Рассмотреть возможность убрать выбор города из корзины после сбора данных по карте", "tag": "ux"}, {"id": "bf4c56db71cb", "text": "Приглушить блок Сбер ID, уменьшить его яркость и размер", "tag": "ux"}, {"id": "40e15bcbb412", "text": "Уточнить актуальность гайдов по Сбер ID у команды брендинга", "tag": "ux"}, {"id": "176aa5f0d27a", "text": "Определить единый стиль и цвет для целевых кнопок - 'Добавить в корзину', 'Оформить заказ'", "tag": "ux"}]}]}, {"id": "s20260922p1i7", "date": "2026-09-22", "dateLabel": "22 сентября", "meta": "22 сентября 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {"weird_word": {"text": "воздушнее", "author": "Надя", "context": "Какие-то блоки стали у тебя как-то воздушнее и поприятнее"}, "catch_phrase": {"text": "принимает как абдоминальный хирург", "author": "Маша", "count": 2}, "smart_comment": {"text": "На карте воспринимается просто до хрена цифр — 244, 330, 344, 40, 24. Стоит понять, почему от такого уже отказывались: выглядит сложновато.", "author": "Костя"}, "filler_word": {"items": [{"text": "вот", "count": 260}, {"text": "ну", "count": 99}, {"text": "просто", "count": 67}], "total": 715}}, "projects": [{"id": "s20260922p1i7-0-0", "author": "Глеб", "title": "Отображение пинов на картах", "tasks": [{"id": "ba57d35536fc", "text": "Рассмотреть все кейсы отображения пинов: с суммами, кластерами, скидками.", "tag": "ux"}, {"id": "7181b320f2e1", "text": "Увеличить контрастность пинов.", "tag": "ux"}, {"id": "119c236d4fb2", "text": "Рассмотреть возможность добавления иконок на пины лабораторий.", "tag": "ux"}, {"id": "4e500425fbaf", "text": "Проверить, как белые кластеры будут выглядеть с белыми карточками — возможно, будет не хватать цвета.", "tag": "ux"}, {"id": "84a104dbc14d", "text": "Сравнить текущие варианты пинов с наработками Ксении по кластерам.", "tag": "ux"}, {"id": "b90cffd6313e", "text": "Сделать пины и кластеры одинаковых цветов.", "tag": "ux"}, {"id": "d48c19962ead", "text": "Учесть, что текущий экран и пины выглядят устаревшими.", "tag": "ux"}, {"id": "75cfff392183", "text": "Притащить пример отображения пинов из приложения Сбербанка для сравнения.", "tag": "ux"}, {"id": "5b738d46bbcd", "text": "Проработать логику отображения пинов: без числовых значений на первом уровне, с появлением информации при приближении.", "tag": "ux"}, {"id": "dc7c32fcfece", "text": "Провести совместную встречу с Ксенией для доработки пинов.", "tag": "ux"}, {"id": "8cb42fc435b8", "text": "Определиться с цветами пинов и кластеров.", "tag": "ux"}]}, {"id": "s20260922p1i7-0-1", "author": "Глеб", "title": "Страница врача", "tasks": [{"id": "8888df974196", "text": "Убрать визуальный шум и неважную информацию из верхнего блока.", "tag": "ux"}, {"id": "a933c3866f35", "text": "Усилить акцент на рейтингах и отзывах.", "tag": "ux"}, {"id": "68038111345b", "text": "Упростить и сделать понятнее блок конфигуратора (специальность, клиника, цена, время).", "tag": "ux"}, {"id": "bf8ea72114d9", "text": "По возможности отказаться от одного раскрытого переключателя в конфигураторе.", "tag": "ux"}, {"id": "d7d2785d64f0", "text": "Убедиться, что на первом экране видна информация «С чем помогает врач» и рейтинг.", "tag": "ux"}, {"id": "4724540eecaf", "text": "Уточнить у Артема актуальность и достоверность данных в блоке «С чем помогает врач».", "tag": "ux"}, {"id": "7db7e33f8106", "text": "Добавить в админке поле для клиник, чтобы они могли самостоятельно загружать иконки/логотипы.", "tag": "dev"}, {"id": "ebe0dbd18a0c", "text": "Продумать юридический процесс согласования логотипов клиник, если они будут создаваться на аутсорсе.", "tag": "ux"}, {"id": "c4ba4cb91036", "text": "Сделать блок «Опыт и образование» переключателем, чтобы он не был слишком большим и не мешал быстрому доступу к отзывам.", "tag": "ux"}, {"id": "150f06870b11", "text": "Рассмотреть возможность убирать блок «Образование» в модальное окно, если он слишком длинный.", "tag": "ux"}, {"id": "580dd007fe23", "text": "Доработать блок с отзывами.", "tag": "ux"}, {"id": "d8f8a4b7c337", "text": "Продумать релевантный рекомендательный блок вместо «врачи дешевле».", "tag": "ux"}, {"id": "5ebfef3cc9b6", "text": "Сохранить визуальную преемственность трехсторонней связки «клиника, специальность, цена».", "tag": "ux"}, {"id": "47462f57835a", "text": "Сравнить первый экран страницы врача с карточкой врача из выдачи, чтобы избежать дублирования информации.", "tag": "ux"}, {"id": "deb91829598c", "text": "Вернуть графический разделитель (карту) из концепта для разгрузки страницы и создания ритма.", "tag": "ux"}, {"id": "81aaaaa1df29", "text": "Решить, показывать ли адрес и станции метро одновременно, или использовать прогрессивное раскрытие.", "tag": "ux"}, {"id": "5d13c9c61101", "text": "Визуализировать блок «Опыт работы» с помощью буллетов вместо сплошного текста.", "tag": "ux"}, {"id": "373ebd65553c", "text": "Пересмотреть акцент на рейтинге 4.7 — он слишком крупный и выглядит как оценка фильма.", "tag": "ux"}, {"id": "9aa03021db86", "text": "Изменить вид чипсов в блоке «С чем поможет», чтобы они не выглядели как кнопки фильтрации.", "tag": "ux"}, {"id": "7184997b130e", "text": "Устранить дублирование заголовка «С чем поможет».", "tag": "ux"}, {"id": "bd8f021f74e5", "text": "Проверить и скорректировать отступы и выравнивание элементов на странице.", "tag": "ux"}, {"id": "37d7ea7fd143", "text": "Устранить визуальную неоднозначность двух блоков «С чем поможет» с разной информацией.", "tag": "ux"}, {"id": "5cead6a48831", "text": "Пересмотреть логику чипсов-якорных ссылок, если они все ведут в одно место.", "tag": "ux"}, {"id": "f606a7f14f8d", "text": "Пересмотреть логику блока с клиниками, чтобы избежать «прямоугольников в прямоугольниках».", "tag": "ux"}, {"id": "927fd72d1aa2", "text": "Сделать ссылки зелеными, как в гайдлайнах.", "tag": "ux"}, {"id": "c0bc616d73fb", "text": "Привести компоненты на странице к единой дизайн-системе, обновить слоты.", "tag": "dev"}, {"id": "d0398df5c80b", "text": "Сделать карту интерактивной, отображая маршрут до клиники на основе геопозиции пользователя.", "tag": "ux"}]}, {"id": "s20260922p1i7-1-0", "author": "Аня", "title": "Баннеры для беременных", "tasks": [{"id": "616d9d61dcd7", "text": "Отказаться от изображений людей и маскотов (включая эмбриона) в пользу абстракций, согласно брендбуку.", "tag": "ux"}, {"id": "eb3fd2d2fb5f", "text": "Разработать логичную метафору для беременности в абстрактном стиле.", "tag": "ux"}, {"id": "958c4f25e9e1", "text": "Убрать размытость сердца на фоне календаря для более чистого вида.", "tag": "ux"}, {"id": "8781ba4bd35b", "text": "Учесть, что календарь может быть неоднозначно интерпретирован (например, как женский календарь цикла).", "tag": "ux"}, {"id": "70049a5f8cda", "text": "Изучить иллюстрации из раздела «Беременность» (малинки, капусты) на предмет использования в баннерах, убедиться в их понятности.", "tag": "ux"}, {"id": "78fadbdb948d", "text": "Рассмотреть метафоры, связанные с готовым ребенком (соска, пинетки, пяточки), но учесть, что они могут ассоциироваться с продажей товаров или послеродовым периодом.", "tag": "ux"}, {"id": "972250e8439d", "text": "Соблюдать гайдлайны по баннерам (шрифты, размеры) для консистентности на всех страницах.", "tag": "ux"}, {"id": "ce0eb3ba989d", "text": "Ограничить высоту баннера на экране успеха, чтобы избежать дисбаланса из-за большого количества строк текста.", "tag": "ux"}, {"id": "509a324003ee", "text": "Рассмотреть возможность сделать весь баннер кликабельным без отдельной кнопки для экономии места.", "tag": "ux"}, {"id": "662ac5566c39", "text": "Изучить варианты абстрактных визуалов для Сбербанка (например, округлость, имитирующая живот) и примерить их к баннеру.", "tag": "ux"}, {"id": "643dcdb8586c", "text": "Учесть, что абстракции без текста считываются сложнее, чем более прямые образы.", "tag": "ux"}]}]}, {"id": "s20260825p1i8", "date": "2026-08-25", "dateLabel": "25 августа", "meta": "25 августа 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {"weird_word": {"text": "игривая вёрстка", "author": "Кариша", "context": "Немножко сохранить такую игривую вёрстку, игривую, вот, попробовала"}, "catch_phrase": {"text": "красный недостаточно красный", "author": "Костя", "count": 2}, "smart_comment": {"text": "Главная бесполезна — это подтвердило ещё моё прошлогоднее исследование. В идеале задействовать её под дашборд и статистику: то, что полезно операторам в промежутках между звонками, в начале и в конце дня.", "author": "Кариша"}, "filler_word": {"items": [{"text": "вот", "count": 319}, {"text": "ну", "count": 158}, {"text": "типа", "count": 94}], "total": 838}}, "projects": [{"id": "s20260825p1i8-0-0", "author": "Кариша", "title": "Пайлот (AI assistant)", "tasks": [{"id": "2065cab311ea", "text": "Создать новый локальный компонент для области ввода текста чат-бота.", "tag": "dev"}, {"id": "bbf53c3fd4f2", "text": "Использовать новую кнопку с новым цветом.", "tag": "ux"}, {"id": "3d73448dcac7", "text": "Согласовать возможность использования логотипа.", "tag": "ux"}, {"id": "fed50e90cc1e", "text": "Уточнить у разработки возможность создания кастомных кнопок и текстовых областей.", "tag": "dev"}, {"id": "62e4ef71dc0e", "text": "Принять решение об использовании текущих компонентов дизайн-системы или создании кастомных.", "tag": "ux"}, {"id": "1825f893ff26", "text": "Проконсультироваться с разработкой о реализуемости предложенных решений.", "tag": "dev"}, {"id": "78ffa13ab600", "text": "Уточнить у продакт-менеджера планы по дизайну в этой области.", "tag": "ux"}, {"id": "3aa5e524f052", "text": "Проверить с Егором, поддерживает ли текущая текстовая область нужные функции.", "tag": "dev"}, {"id": "4c9c55b49978", "text": "Принять решение о создании кастомной текстовой области или использовании существующей.", "tag": "ux"}, {"id": "baaf435d432f", "text": "Проверить, допустимо ли отклонение в радиусе скругления (32px).", "tag": "ux"}, {"id": "c934d92beec5", "text": "Придерживаться существующих брендовых цветов, за исключением акцентных элементов.", "tag": "ux"}, {"id": "d12f251dd48d", "text": "Разработать функционал для поиска конкретных звонков.", "tag": "ux"}, {"id": "d71794425ded", "text": "Улучшить подсказки для ввода пользовательских запросов, например, по фамилиям.", "tag": "ux"}, {"id": "120c1e5c4658", "text": "Рассмотреть возможность интеграции части функций напрямую в интерфейс работы со звонками, а не только в чат.", "tag": "ux"}, {"id": "da23f47bb287", "text": "Внедрить функцию быстрой проверки звонков в интерфейс списка звонков.", "tag": "ux"}, {"id": "8e37dd164971", "text": "Создать точку входа для подробных сводок аналитики.", "tag": "ux"}, {"id": "ea56f2cfdfb5", "text": "Рассмотреть создание дашборда для аналитики вместо или в дополнение к чату.", "tag": "ux"}, {"id": "bb9075979274", "text": "Использовать более понятный макет для кнопок-подсказок вместо карточек.", "tag": "ux"}, {"id": "d0bcf5c13c21", "text": "Сделать интерактивные элементы явно отличимыми от декоративных.", "tag": "ux"}, {"id": "b1efd86f0f00", "text": "Реализовать кликабельные подсказки, которые автоматически подставляют текст запроса.", "tag": "ux"}, {"id": "c61256e3dc95", "text": "Предоставить более четкие инструкции о возможностях чата.", "tag": "ux"}, {"id": "335e9730ab80", "text": "Использовать кликабельные подсказки с заранее определенными промптами, релевантными рабочим задачам.", "tag": "ux"}, {"id": "eb26750205bb", "text": "Визуально обозначить интерактивность кликабельных элементов.", "tag": "ux"}, {"id": "d1a353100e89", "text": "Обеспечить единообразие интерактивных элементов и ясность функций иконок.", "tag": "ux"}, {"id": "0c867a61a537", "text": "Разработать динамические и персонализированные подсказки.", "tag": "ux"}, {"id": "61aecfcce420", "text": "Пересмотреть текущую визуализацию для динамических подсказок.", "tag": "ux"}, {"id": "c4b8dd0661f1", "text": "Уточнить вводный текст, чтобы он ясно описывал назначение инструмента.", "tag": "ux"}, {"id": "fe2ffa798ac7", "text": "Добавить всплывающие подсказки или онбординг для новых пользователей.", "tag": "ux"}, {"id": "175745669871", "text": "Продумать взаимодействие чата с модальными окнами входящих звонков.", "tag": "ux"}, {"id": "1b1f1009de16", "text": "Обеспечить сохранение истории чата и данных после прерываний.", "tag": "ux"}, {"id": "12f209e5a947", "text": "Уточнить отображение и организацию истории чата.", "tag": "ux"}]}, {"id": "s20260825p1i8-1-0", "author": "Костя", "title": "Биомаркеры", "tasks": [{"id": "b67b521ad517", "text": "Пересмотреть расположение верхних индикаторов.", "tag": "ux"}, {"id": "2295f6663c16", "text": "Скорректировать красный цвет, чтобы он был более заметным.", "tag": "ux"}, {"id": "7891cabd8e22", "text": "Увеличить размер иконки стрелки.", "tag": "ux"}, {"id": "2ae436aed8b6", "text": "Упростить перегруженный макет.", "tag": "ux"}, {"id": "d235a9f3fda0", "text": "Увеличить размер шрифтов и улучшить ясность текста.", "tag": "ux"}, {"id": "47cb5d3990c2", "text": "Убедиться, что все текстовые элементы легко читаются.", "tag": "ux"}, {"id": "a3a6a27324a6", "text": "Рассмотреть увеличение размера других элементов.", "tag": "ux"}, {"id": "1f24e58d6aba", "text": "Добавить уникальные визуальные элементы или функции для отличия от конкурентов.", "tag": "ux"}, {"id": "27040570d03d", "text": "Реализовать просмотр исторических данных и динамические графики.", "tag": "ux"}, {"id": "3c095fa016af", "text": "Рассмотреть добавление фона к элементам для лучшей визуальной привязки.", "tag": "ux"}, {"id": "abd77e2ee70f", "text": "Упростить полноширинные графики, так как они отвлекают.", "tag": "ux"}, {"id": "0c5345ad24d0", "text": "Удалить скобки из значений нормального диапазона.", "tag": "ux"}, {"id": "b1d9db071db2", "text": "Отображать значения нормального диапазона простым серым текстом.", "tag": "ux"}, {"id": "0233650024f2", "text": "Изучить альтернативные разделители для значений и нормального диапазона.", "tag": "ux"}, {"id": "51237835e23a", "text": "Использовать правильный тип тире для диапазонов.", "tag": "ux"}, {"id": "f95adef87fe8", "text": "Уточнить значение и представление маленьких боковых графиков.", "tag": "ux"}, {"id": "560de7781773", "text": "Добавить фон к маленьким графикам для ясности.", "tag": "ux"}, {"id": "81770b7151af", "text": "Обеспечить соответствие цветовой кодировки в графиках статусу значения (например, красный для высокого, зеленый для нормы).", "tag": "ux"}, {"id": "2bcc2525d1e8", "text": "Увеличить размер иконки.", "tag": "ux"}, {"id": "59284737b605", "text": "Изменить иконку раскрытия на шеврон.", "tag": "ux"}, {"id": "ddba0a961bd8", "text": "Скорректировать цвет иконки в соответствии с контекстом.", "tag": "ux"}, {"id": "8b3d1b6410c9", "text": "Рассмотреть использование столбчатых диаграмм вместо несвязанных линий.", "tag": "ux"}, {"id": "55cac09c4e8b", "text": "Использовать соединенные линейные графики для лучшей передачи временных рядов.", "tag": "ux"}, {"id": "111be33e6293", "text": "Четко обозначить последнее значение на графике.", "tag": "ux"}, {"id": "660019645e77", "text": "Удалить двоеточия из отображения нормального диапазона.", "tag": "ux"}, {"id": "405e7bdf1c30", "text": "Рассмотреть использование текста «в норме» вместо числового диапазона.", "tag": "ux"}, {"id": "3bbba4105756", "text": "Протестировать, могут ли пользователи визуализировать нормальные диапазоны; если нет, упростить, удалив их.", "tag": "ux"}, {"id": "6823012ae577", "text": "Пересмотреть и потенциально скорректировать зеленый цвет из дизайн-системы для акцентного использования.", "tag": "ux"}, {"id": "5a978986625b", "text": "Пересмотреть и потенциально скорректировать красный цвет.", "tag": "ux"}, {"id": "43458b4bf789", "text": "Рассмотреть добавление новых акцентных цветов в дизайн-систему.", "tag": "ux"}, {"id": "bbbd877537ec", "text": "Удалить информацию о бонусах и городе из заголовка.", "tag": "ux"}, {"id": "aa98853bedd7", "text": "Уменьшить количество контрастных цветов на странице.", "tag": "ux"}, {"id": "ea0eb285271f", "text": "Упростить и успокоить дизайн заголовка.", "tag": "ux"}, {"id": "0386e780e81b", "text": "Обеспечить соответствие существующим паттернам вкладок.", "tag": "ux"}, {"id": "0263b93c5761", "text": "Заменить синие вкладки на более согласованный дизайн.", "tag": "ux"}, {"id": "5df72c451362", "text": "Попробовать монохромные вкладки (черный/серый) вместо синих.", "tag": "ux"}, {"id": "7488868dcd0e", "text": "Рассмотреть макет с зеленым заголовком и большим белым блоком контента.", "tag": "ux"}, {"id": "b1ff34629bdc", "text": "Сохранять четкую визуальную иерархию.", "tag": "ux"}, {"id": "d72c0188707b", "text": "Расширить блоки контента на всю ширину.", "tag": "ux"}, {"id": "4591f1787098", "text": "Добавить фон к области контента.", "tag": "ux"}, {"id": "64e9dd157a28", "text": "Рассмотреть возможность удаления основного заголовка, оставив только зеленый блок.", "tag": "ux"}, {"id": "55e8c28678f1", "text": "Скорректировать цвет серого фона, чтобы он лучше сочетался с зеленым.", "tag": "ux"}, {"id": "2e56565a654b", "text": "Использовать сплошные белые карточки на сером фоне вместо контурных.", "tag": "ux"}, {"id": "8547f11bf025", "text": "Уменьшить визуальный шум от слишком большого количества линий/границ.", "tag": "ux"}, {"id": "afaf743549c4", "text": "Экспериментировать с удалением фона и сохранением белых карточек.", "tag": "ux"}, {"id": "52e0879bcaf4", "text": "Разработать фон, который плавно интегрируется с карточками.", "tag": "ux"}, {"id": "5e15ac8be066", "text": "Попробовать градиентный переход от зеленого к серому для фона.", "tag": "ux"}, {"id": "ec5a495bb192", "text": "Принять решение об использовании визуального фона/градиента.", "tag": "ux"}, {"id": "761a6829888d", "text": "Изучить существующие паттерны дизайна для списков и карточек.", "tag": "ux"}, {"id": "c5bc9c95b668", "text": "Упростить визуальный дизайн, уменьшить количество цветов и ярких фонов.", "tag": "ux"}, {"id": "935b09a9bc30", "text": "Рассмотреть использование черного текста для значений и только цвета для графиков.", "tag": "ux"}, {"id": "bc523717d778", "text": "Скорректировать палитру красного и зеленого цветов, чтобы избежать «арбузного» ощущения.", "tag": "ux"}, {"id": "db2036a2b918", "text": "Найти лучшие оттенки красного и зеленого, которые дополняют друг друга.", "tag": "ux"}, {"id": "87578b53e990", "text": "Обеспечить единообразный размер шрифтов для всех значений.", "tag": "ux"}, {"id": "4b54d9971ba8", "text": "Использовать меньший, более информативный график из левого макета.", "tag": "ux"}, {"id": "ecbf2179cd91", "text": "Улучшить дизайн графика, чтобы четко различать сегменты и значения.", "tag": "ux"}, {"id": "f8f9dbbffcea", "text": "Объединить черный текст для значений с четкими индикаторами «норма/не норма».", "tag": "ux"}, {"id": "8a73c72bd8de", "text": "Увеличить график исторических данных.", "tag": "ux"}, {"id": "fa9403f1d22f", "text": "Сделать график более заметным внутри карточки.", "tag": "ux"}, {"id": "063131e7d391", "text": "Использовать цвет преимущественно в графиках, оставляя текст значений черным.", "tag": "ux"}, {"id": "9078698d8ca6", "text": "Увеличить интервалы и визуальный вес для графических элементов.", "tag": "ux"}, {"id": "101beaf423b9", "text": "Добавить четкий общий заголовок страницы.", "tag": "ux"}, {"id": "f85efbb50a4c", "text": "Рассмотреть цветной заголовок, изучая существующие паттерны редизайна.", "tag": "ux"}, {"id": "c7eee8c2a7cc", "text": "Обеспечить наличие и функциональность кнопки «назад».", "tag": "ux"}, {"id": "1ebfec5a92d6", "text": "Уточнить взаимодействие кнопки «назад» с меню-бургером.", "tag": "ux"}]}]}, {"id": "s20260820p2i9", "date": "2026-08-20", "dateLabel": "20 августа", "meta": "20 августа 2026 · Ревью ч.2 · чт", "designersCount": 4, "fun": {"weird_word": {"text": "лютая дичь", "author": "Костя", "context": "Ну, начало всё превращаться в лютую дичь, и вот мы сейчас потихоньку это будем менять"}, "catch_phrase": {"text": "которые не выделены", "author": "Надя", "count": 4}, "smart_comment": {"text": "Мы минимизировали для пользователя выбор и оставили только два тарифа: базовый — просто почистить зубы, и базовый плюс гигиенический уход, в который включены более мощные штуки.", "author": "Рома"}, "filler_word": {"items": [{"text": "вот", "count": 274}, {"text": "типа", "count": 158}, {"text": "ну", "count": 156}], "total": 870}}, "projects": [{"id": "s20260820p2i9-0-0", "author": "Надя", "title": "Ошибки и иконки", "tasks": [{"id": "4fc1e2ae338a", "text": "Использовать новые иконки вместо старых.", "tag": "ux"}, {"id": "1aea13c7f080", "text": "Уточнить у брендинга, можно ли сейчас заносить иконки в дизайн-систему.", "tag": "ux"}, {"id": "541d6a2ed21d", "text": "Создать иконки самостоятельно и согласовать с Алиной.", "tag": "ux"}, {"id": "6b6650b4a178", "text": "Передать текущие иконки Алине, отметив, что это временное решение.", "tag": "ux"}, {"id": "a99e37f3acf7", "text": "Сгенерировать подходящую иконку лупы для страницы 404.", "tag": "ux"}, {"id": "a12b40a57647", "text": "Пересмотреть стиль иконок на плашках, текущий не нравится.", "tag": "ux"}, {"id": "dc6ce3a9b626", "text": "Сократить объем текста на мобильных экранах ошибок.", "tag": "ux"}, {"id": "e0b411013aeb", "text": "Попросить Романа Осипова сделать иконку лупы.", "tag": "ux"}]}, {"id": "s20260820p2i9-1-0", "author": "Рома", "title": "Страница гигиенической чистки зубов", "tasks": [{"id": "db1c27bfb35b", "text": "Собрать гайд или провести воркшоп по генерации анимаций.", "tag": "ux"}, {"id": "5a9b72991a51", "text": "Собрать фидбэк от пользователей по тестированию страницы в Passway и добавить важные элементы.", "tag": "ux"}]}, {"id": "s20260820p2i9-2-0", "author": "Костя", "title": "Десктопная версия личного кабинета и экраны ожидания заказа", "tasks": [{"id": "b00f61d7c80e", "text": "Доработать статусы на десктопной версии ЛК согласно комментариям.", "tag": "ux"}, {"id": "c4dfd1a9819b", "text": "Добавить статус «Заказ лаборатории» перед блоком «Следующая сдача анализов».", "tag": "ux"}, {"id": "211956287ed5", "text": "Переделать экран с календарем.", "tag": "ux"}, {"id": "2680727d673a", "text": "Улучшить отображение расшифровки анализов и плана лечения в медкарте.", "tag": "ux"}, {"id": "3498a9a3ef78", "text": "Повысить видимость баннеров, так как они теряются.", "tag": "ux"}, {"id": "5b79d5a6cdbf", "text": "Изучить редизайн приложения для визуальных решений в «Хрониках».", "tag": "ux"}, {"id": "574ae185ef3f", "text": "Постепенно трансформировать быстро набросанные элементы.", "tag": "ux"}]}, {"id": "s20260820p2i9-2-1", "author": "Костя", "title": "Мои биомаркеры и история анализов", "tasks": [{"id": "6cc201f511d9", "text": "Разработать кнопку «Все мои биомаркеры» на главной странице анализов.", "tag": "ux"}, {"id": "9be8dbfa6b0e", "text": "Уточнить нейминг вкладок, например, «Мои анализы» / «Уже сдавали».", "tag": "ux"}, {"id": "efd5f89d5e62", "text": "Добавить дату и название анализа в «Историю анализов».", "tag": "ux"}, {"id": "da8ef81d5cbc", "text": "Уменьшить количество текста и улучшить визуальную иерархию в графиках биомаркеров.", "tag": "ux"}, {"id": "102a1eacc4b8", "text": "Убрать текущий год из дат, если он совпадает с текущим.", "tag": "ux"}, {"id": "f2de977126aa", "text": "Добавить больше воздуха и акцентировать текущее значение в графиках.", "tag": "ux"}, {"id": "f0ca4bf1acaf", "text": "Выделить текущее значение более жирным шрифтом или подложкой.", "tag": "ux"}, {"id": "099a9832631d", "text": "Изучить «Риск профиль» для примера отображения значений и отступов в графиках.", "tag": "ux"}, {"id": "ff0182d0f12f", "text": "Разместить основное значение над графиком для лучшего выделения.", "tag": "ux"}, {"id": "0e294c37d7cd", "text": "Пересмотреть необходимость отображения всех референсных значений на главном экране графика.", "tag": "ux"}, {"id": "f7ec2833df5c", "text": "Сохранить референсные значения на главном экране, так как это запрос пользователей.", "tag": "ux"}, {"id": "ebef824bba4b", "text": "Сделать основное значение (например, 6.2) более заметным.", "tag": "ux"}, {"id": "bb5d348c9e2d", "text": "Найти баланс между количеством отображаемых биомаркеров и размером карточек.", "tag": "ux"}, {"id": "e77844a9c386", "text": "Оптимизировать пространство в шапке, возможно, интегрировав навигационные элементы.", "tag": "ux"}, {"id": "a202e4aeb182", "text": "Убрать информацию о городе и бонусах из шапки в разделе биомаркеров.", "tag": "ux"}, {"id": "56bd7d8399e7", "text": "Рассмотреть возможность сделать раздел биомаркеров отдельной страницей с упрощенной шапкой.", "tag": "ux"}, {"id": "6487386fbfa2", "text": "Изучить использование одинаковых делений для нормы/отклонений в графиках.", "tag": "ux"}, {"id": "ef236a3ca4f2", "text": "Использовать визуальные решения из нового редизайна приложения для графиков и динамики.", "tag": "ux"}, {"id": "902770589908", "text": "Группировать биомаркеры по дате или анализу, чтобы избежать дублирования дат.", "tag": "ux"}, {"id": "562571914db0", "text": "Пересмотреть идею группировки биомаркеров по дате/анализу с использованием заголовков.", "tag": "ux"}, {"id": "45f04f7fa3b6", "text": "Протестировать удаление дат из основного списка биомаркеров, оставляя их только в детальном графике.", "tag": "ux"}, {"id": "44b1d05537f6", "text": "Протестировать удаление референсных значений из основного списка, оставляя только текущее значение.", "tag": "ux"}, {"id": "942c50812aad", "text": "Оптимизировать отступы внутри карточек биомаркеров, чтобы уменьшить пустоту.", "tag": "ux"}, {"id": "e44e8cd45f54", "text": "Аккуратно разместить информацию о дате сдачи под названием биомаркера при растягивании карточки.", "tag": "ux"}, {"id": "89def9914137", "text": "Упростить визуальный дизайн карточек биомаркеров для уменьшения загруженности.", "tag": "ux"}, {"id": "990b4ec620fb", "text": "Попробовать использовать плашки с серым фоном вместо обведенных карточек.", "tag": "ux"}, {"id": "28d3c6cdf65d", "text": "Уточнить логику размещения референсных значений на графике.", "tag": "ux"}, {"id": "14e36882ccf9", "text": "Исправить несоответствия в размещении референсных значений на разных графиках.", "tag": "ux"}, {"id": "9815051ca17f", "text": "Стандартизировать отображение референсных значений.", "tag": "ux"}, {"id": "d56f3d1dcd29", "text": "Зафиксировать положение маркеров нормы.", "tag": "ux"}, {"id": "7eb9c3303a00", "text": "Разместить текущее значение (например, 6.1) над графиком для выравнивания цифр.", "tag": "ux"}]}, {"id": "s20260820p2i9-3-0", "author": "Кариша", "title": "Добавление фотографии в ЛК клиник", "tasks": [{"id": "45f01afb1f85", "text": "Определить сценарии обработки ошибок при загрузке фотографий.", "tag": "ux"}, {"id": "a59f1e0d3b80", "text": "Уточнить, сохраняется ли предыдущая фотография, если новая не прошла валидацию.", "tag": "ux"}, {"id": "507b5089c3db", "text": "Определить, нужен ли кейс сохранения предыдущей фотографии при ошибке загрузки новой.", "tag": "ux"}, {"id": "9dcbb45ce6e0", "text": "Разработать дизайн состояния ошибки, который четко показывает наличие старой фотографии.", "tag": "ux"}, {"id": "6a53b1c097f9", "text": "Обеспечить, чтобы старая фотография оставалась видимой при неудачной загрузке новой.", "tag": "ux"}, {"id": "34566d17ef88", "text": "Рассмотреть использование стандартного тост-уведомления для ошибок загрузки.", "tag": "ux"}, {"id": "8dcefc74cfa7", "text": "Разделить обработку ошибок для первичной загрузки фото (нет предыдущей) и обновления существующей.", "tag": "ux"}, {"id": "c5a7ce963d24", "text": "Реализовать два отдельных сценария обработки ошибок для загрузки фотографий: для первичной загрузки и для обновления.", "tag": "ux"}, {"id": "34930f2f5e7e", "text": "Использовать тост-уведомление в обоих случаях, но сохранять старую фотографию при обновлении и показывать пустое состояние при первичной загрузке.", "tag": "ux"}, {"id": "4cf3506c2988", "text": "Проконсультироваться с разработкой о реализуемости и сложности предложенных решений по обработке ошибок.", "tag": "dev"}]}]}, {"id": "s20260811p1i10", "date": "2026-08-11", "dateLabel": "11 августа", "meta": "11 августа 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260811p1i10-0-0", "author": "Аня", "title": "Точки входа в сервис для беременных", "tasks": [{"id": "0c5c710d6f54", "text": "Поднять вопрос о качестве изображений в статьях, так как они выглядят «печально»", "tag": "ux"}, {"id": "3dc416e4183b", "text": "Раскопать проблему странных картинок и искошенных шрифтов в статьях", "tag": "ux"}, {"id": "1203d6dc48da", "text": "Попробовать через Карину пушнуть историю с улучшением качества изображений и шрифтов в статьях", "tag": "ux"}, {"id": "dc77da1d42ee", "text": "Добавить понятный глагол в заголовок «Все из статьи по неделям беременности»", "tag": "ux"}, {"id": "d2687c8a0e15", "text": "Убрать жесткую связь между заголовком и статьей, сделать заголовок более понятным без предварительного изучения статьи", "tag": "ux"}, {"id": "0b1ecbb92240", "text": "Заменить логотип Сбербанка на актуальный логотип сервиса", "tag": "ux"}, {"id": "7644723a1abe", "text": "Установить четкую связку между заголовком и кнопкой действия, чтобы пользователь понимал, куда ведет кнопка", "tag": "ux"}, {"id": "37e22da58d75", "text": "Избежать конфликта двух синих кнопок на экране", "tag": "ux"}, {"id": "cd1be86fae2f", "text": "Упростить заголовок в стики-блоке, чтобы он не выглядел агрессивно и тяжело", "tag": "ux"}, {"id": "bab374b972ef", "text": "Согласовать использование розового логотипа Сбера с брендингом", "tag": "ux"}, {"id": "f10f6b5f0eab", "text": "Переформулировать текст баннера, чтобы он решал «жабу» пользователя, например: «Пройдите путь беременности по неделям» с CTA «Смотреть план»", "tag": "ux"}, {"id": "3df418e68ae0", "text": "Заменить графику с экранами интерфейсов на графику с календарем, отмечающим путь беременности", "tag": "ux"}, {"id": "a95ae74ca35a", "text": "Сделать акцент в баннере на самом сервисе и его помощи в прохождении пути беременности, с более задорным CTA", "tag": "ux"}, {"id": "1ffa36da532b", "text": "Не привязывать баннер к статье, сделать его самостоятельным и понятным", "tag": "ux"}, {"id": "ac80727ad6c6", "text": "Сделать CTA более конкретным и понятным, например, «Получить план беременности» или «Выбрать неделю»", "tag": "ux"}, {"id": "2c8fada50185", "text": "Сделать заголовок стики-кнопки коротким, в одну строку, с использованием иконки для идентификации", "tag": "ux"}, {"id": "862e9d46e5a3", "text": "Сформировать CTA, исходя из запросов пользователей, по которым они приходят на страницу, чтобы показать выгоду сервиса", "tag": "ux"}, {"id": "c99360d4e336", "text": "Убрать фразу «в одном месте» из текста", "tag": "ux"}, {"id": "0d250f3e4858", "text": "Сделать акцент на индивидуальности и персонализации сервиса в CTA, подчеркивая, что информация будет собрана «под тебя»", "tag": "ux"}, {"id": "c6808d42c51e", "text": "Создать заголовок, который решает проблему пользователя, и добавить привлекательную миниатюру, избегая баннерной слепоты", "tag": "ux"}, {"id": "5cda22c444fb", "text": "Реализовать сворачивающийся баннер в виде маленького виджета с календариком, который следует за пользователем при пролистывании", "tag": "dev"}, {"id": "6ba556b42c3d", "text": "Обсудить с Кариной возможность ведения на сервис вместо текущих залипающих элементов, чтобы избежать перегрузки экрана", "tag": "ux"}, {"id": "ef2001f997b4", "text": "Добавить возможность закрытия стики-кнопки, так как это рекламный элемент, а не обязательное действие", "tag": "ux"}, {"id": "be01ac5dea8a", "text": "Не перебивать статью дополнительными баннерами, если будет реализован залипающий стикер сбоку", "tag": "ux"}, {"id": "22311e33af1b", "text": "Сделать больший упор на визуал в первом баннере, уменьшив количество текста, чтобы он не резонировал с текстом статьи", "tag": "ux"}, {"id": "623a10760db9", "text": "Привлечь Романа для помощи с визуалом баннера", "tag": "ux"}]}, {"id": "s20260811p1i10-1-0", "author": "Костя", "title": "Без названия", "tasks": [{"id": "a92e8ebde6b6", "text": "Убрать верхние статусы над заголовком или уменьшить их количество/визуальное отображение", "tag": "ux"}, {"id": "1c2bf5f53094", "text": "Пересмотреть формулировку статуса «ожидаем результатов анализов» на первом экране, так как пользователь еще не сдал их", "tag": "ux"}, {"id": "fc1eb6636094", "text": "Пересмотреть логику отображения статуса «один показатель требует внимания», чтобы он не зависал надолго", "tag": "ux"}, {"id": "82f6e573b0d6", "text": "Упростить цветовое кодирование статусов, чтобы избежать путаницы между «требует внимания» и «есть отклонение»", "tag": "ux"}, {"id": "33ed744c3a94", "text": "Уменьшить количество мелких текстов на экране", "tag": "ux"}, {"id": "bec6bfcce3ce", "text": "Сделать визуальный акцент на плашке «Сдайте анализы» на первом экране", "tag": "ux"}, {"id": "39abf89a3c00", "text": "Уменьшить визуальный акцент на синих часах, чтобы они не перетягивали внимание", "tag": "ux"}, {"id": "84ebc2f49211", "text": "Переработать текст под часами на первом экране, чтобы он соответствовал текущему статусу пользователя до сдачи анализов", "tag": "ux"}, {"id": "e78871f3bda6", "text": "Изменить отображение кнопки «открыто до 21» со стрелочкой, используя подход Яндекса для отображения режима работы клиники", "tag": "ux"}, {"id": "a136abd2769d", "text": "Пересобрать страницу, объединив три блока с информацией в один, с акцентной картинкой и базой анализов", "tag": "ux"}, {"id": "2d39135c2bd3", "text": "Убедиться, что размеры шрифтов для «Мои показатели» и «Анализы на контроле» одинаковы", "tag": "ux"}, {"id": "d602f4bd84e2", "text": "Переименовать «Мои показатели» в «Биомаркеры»", "tag": "ux"}, {"id": "ab6aa03ac359", "text": "Найти способ связать блоки «Мои показатели» и «Анализы на контроле» визуально или логически", "tag": "ux"}, {"id": "7eadf71e4a95", "text": "Рассмотреть использование табов для разделения «Моих показателей» и «Анализов на контроле»", "tag": "ux"}, {"id": "734c6f59b8dd", "text": "Рассмотреть вариант одной плашки, которая объединяет информацию о сдаче анализов и статусе, с постепенным появлением статистики", "tag": "ux"}, {"id": "b95b73152c76", "text": "Не размещать блоки «Мои показатели» и «Анализы в контроле» друг под другом", "tag": "ux"}, {"id": "0c02dbb9d71f", "text": "Реализовать табы для «Анализов» и «Биомаркеров», где вкладка «Биомаркеры» появляется при наличии данных или имеет заглушку", "tag": "dev"}]}]}, {"id": "s20260806p2i11", "date": "2026-08-06", "dateLabel": "6 августа", "meta": "6 августа 2026 · Ревью ч.2 · чт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260806p2i11-0-0", "author": "Ксюша", "title": "Прогресс-бар для повышения чека", "tasks": [{"id": "4c0a5c5595a8", "text": "Уточнить в интерфейсе условия получения скидки", "tag": "ux"}, {"id": "d696bce59407", "text": "Сделать условия получения скидки более заметными, не полагаться на мелкий текст", "tag": "ux"}, {"id": "5ab38db6f925", "text": "Привязать блок с прогрессом к нижней части экрана или к кнопке", "tag": "ux"}, {"id": "34001f429faa", "text": "Уменьшить количество текста и стилей цифр, сделать блок компактнее", "tag": "ux"}, {"id": "892fa8de2987", "text": "Убрать информацию о скидке на забор материала из прибитой кнопки", "tag": "ux"}, {"id": "259ea89e618a", "text": "Сделать полоску прогресса компактнее и чище", "tag": "ux"}, {"id": "c5d3d56def44", "text": "Улучшить связь между текстом и графическим элементом прогресс-бара", "tag": "ux"}, {"id": "27747c2e9dd4", "text": "Упростить визуал прогресс-бара — убрать блестяшки, градиенты, использовать более чистый цвет", "tag": "ux"}, {"id": "7a597ddba5a0", "text": "Изменить заголовок, чтобы он не звучал «по-скамерски» и явно указывал на условия получения скидки", "tag": "ux"}, {"id": "b86b2dc25662", "text": "Пересмотреть цветовую гамму прогресс-бара, использовать цвета, соответствующие дизайн-системе", "tag": "ux"}, {"id": "c4a1037831e4", "text": "Рассмотреть возможность отображения прогресс-бара только в «залипашке» внизу экрана, без отдельного блока в корзине", "tag": "ux"}, {"id": "8beb0633242b", "text": "Использовать компонент прогресса из дизайн-системы для консистентности", "tag": "ux"}, {"id": "46e1c4b860c0", "text": "Успокоить общую визуальную нагрузку блоков на странице", "tag": "ux"}, {"id": "4d58c5789461", "text": "Не делать сильный акцент на прогресс-баре, если он будет «липким»", "tag": "ux"}, {"id": "9c6b9947899d", "text": "Убрать лишние декоративные элементы, такие как «снежинки» или «ракеты»", "tag": "ux"}, {"id": "4f9e811639ce", "text": "Привязать сумму скидки к графическому элементу прогресс-бара, показывая начальное и конечное значение", "tag": "ux"}, {"id": "6205e183bd32", "text": "Отображать конкретную сумму, которую нужно добрать до скидки", "tag": "ux"}, {"id": "ad38482f3f8f", "text": "Перенести виджет прогресс-бара на главный экран при добавлении товаров оттуда", "tag": "ux"}]}, {"id": "s20260806p2i11-1-0", "author": "Надя", "title": "Повторные замеры и рекомендации", "tasks": [{"id": "9cb85662b501", "text": "Попробовать использовать черный фон для карточек замеров", "tag": "ux"}, {"id": "660c51303b9f", "text": "Разработать новую систему рекомендаций, исключив дорогие продукты вроде «умного стетоскопа»", "tag": "ux"}, {"id": "1da518dd6a49", "text": "Переместить блоки рекомендаций наверх страницы", "tag": "ux"}, {"id": "d15aff0c4d51", "text": "Обеспечить визуальную консистентность с другими частями приложения, особенно с функционалом Риты", "tag": "ux"}]}]}, {"id": "s20260716p2i12", "date": "2026-07-16", "dateLabel": "16 июля", "meta": "16 июля 2026 · Ревью ч.2 · чт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260716p2i12-0-0", "author": "Аня", "title": "Сервис беременности", "tasks": [{"id": "edbb3b3af338", "text": "Уточнить у Нади Заборы допустимый фотостиль для первого экрана сервиса.", "tag": "ux"}, {"id": "7dc09dc59ece", "text": "Добавить поддерживающую информацию для ранних недель беременности (до 6-й недели).", "tag": "ux"}, {"id": "86cc1776a0da", "text": "Уточнить текст для отображения ранних недель, например, «до десятой недели».", "tag": "ux"}, {"id": "d15fe4ede3b1", "text": "Пересмотреть стратегию показа всего контента без авторизации, чтобы сохранить ценность авторизации.", "tag": "ux"}, {"id": "a7f42f779ddf", "text": "Уточнить у Карины, насколько весь контент во внутренних табах будет индексироваться для SEO.", "tag": "ux"}, {"id": "23c40648ab4e", "text": "Поднять блок с авторизацией выше, чтобы стимулировать пользователя к авторизации.", "tag": "ux"}, {"id": "3f6052700bdc", "text": "Убрать дублирующий текст из закрепленной кнопки «Рассчитайте срок, и план подстроится».", "tag": "ux"}, {"id": "85f33e6c8ae4", "text": "Удалить футер из раздела «Календарь».", "tag": "ux"}, {"id": "8a2c26ee5288", "text": "Добавить заглушечное состояние для календаря, когда срок беременности не рассчитан.", "tag": "ux"}, {"id": "07ba7ce0a40a", "text": "Не совмещать функционал работающего календаря с состоянием нерассчитанного срока на первом этапе.", "tag": "dev"}]}, {"id": "s20260716p2i12-1-0", "author": "Ксюша", "title": "Хороший врач", "tasks": [{"id": "48c32b6774a5", "text": "Объединить все кнопки редактирования на карточке в одну.", "tag": "ux"}, {"id": "430c051f33d0", "text": "Использовать единую кнопку редактирования для всех атрибутов шаблона.", "tag": "ux"}, {"id": "7719dbf97020", "text": "Продумать, как объединить действия редактирования.", "tag": "ux"}, {"id": "6af732cefcd8", "text": "Уточнить состояние кнопки добавления/редактирования комментария после его добавления.", "tag": "ux"}, {"id": "8d95e6ab3e91", "text": "Консолидировать все действия с шаблоном (редактирование, добавление/редактирование комментария, удаление) под одной кнопкой или меню «три точки».", "tag": "ux"}, {"id": "2ba2f01f313e", "text": "Реализовать редактирование названия шаблона по клику/двойному клику на заголовок.", "tag": "ux"}, {"id": "f5400d679a01", "text": "Улучшить визуализацию блока с видеоинструкцией.", "tag": "ux"}, {"id": "82a22b67ff85", "text": "Переработать блок видеоинструкции: использовать формат сторис, создать эстетичную обложку, убрать кнопку Play, убрать темный оверлей, переместить в блок сторис после первого просмотра.", "tag": "ux"}, {"id": "048105f611c4", "text": "Пересмотреть автоматическое создание шаблона при нажатии «Поделиться».", "tag": "ux"}, {"id": "9aba1a22e6e6", "text": "Добавить явную кнопку «Сохранить в шаблоны» при шаринге корзины.", "tag": "ux"}, {"id": "fe7204fbc4b8", "text": "Добавить функционал удаления шаблонов корзин.", "tag": "ux"}, {"id": "4bd4d0108108", "text": "Разработать пустое состояние для раздела «Шаблоны корзин».", "tag": "ux"}, {"id": "6f340759e180", "text": "Стандартизировать сайдбар с существующими компонентами, учесть меньшие отступы, состояния ховера/клика и возможность расширения.", "tag": "ux"}, {"id": "acdcfe50f8df", "text": "Стандартизировать хедер с существующими компонентами.", "tag": "ux"}, {"id": "fda1b573e148", "text": "Уточнить пустое состояние для онбординг-тура.", "tag": "ux"}, {"id": "4fc5e4c363f1", "text": "Пересмотреть необходимость тултипов, если информация уже понятна из контекста.", "tag": "ux"}, {"id": "c13d3b4078fe", "text": "Улучшить формулировку действия «Редактировать», которое ведет на другой сайт.", "tag": "ux"}, {"id": "671806495412", "text": "Кастомизировать всплывающее окно «Поделиться» для врачей, чтобы подтверждать создание шаблона и предлагать переход к нему.", "tag": "ux"}, {"id": "dca4582c48bd", "text": "Уточнить семантику и функционал иконок карандаша и бабла.", "tag": "ux"}, {"id": "c04ce689731d", "text": "Разместить иконку редактирования названия непосредственно рядом с названием.", "tag": "ux"}, {"id": "e2a80c84255f", "text": "Разрешить прямое редактирование названия по клику.", "tag": "ux"}, {"id": "ea0af12e6e21", "text": "Убрать белый фон у заголовка страницы.", "tag": "ux"}, {"id": "6fd8d65f3d56", "text": "Консолидировать редактирование названия под одной кнопкой.", "tag": "ux"}, {"id": "193b9edf1b1b", "text": "Изменить состояние кнопки добавления комментария после его добавления.", "tag": "ux"}, {"id": "d873dd570aac", "text": "Разъяснить, почему действие «Редактировать» создает новый шаблон.", "tag": "ux"}, {"id": "fba32faafada", "text": "Переименовать кнопку «Редактировать» в «Дублировать и изменить», чтобы отразить фактическое поведение.", "tag": "ux"}, {"id": "e98d1946913f", "text": "Реализовать функционал удаления шаблонов.", "tag": "ux"}, {"id": "1515c655729b", "text": "Добавить возможность удаления комментария внутри модального окна редактирования комментария.", "tag": "ux"}, {"id": "4ad345d0c775", "text": "Добавить статистику по самым популярным/оплачиваемым корзинам.", "tag": "ux"}, {"id": "51fdb4628a13", "text": "Рассмотреть автозапуск видеоинструкции.", "tag": "ux"}, {"id": "2517de4d0e14", "text": "Улучшить эстетику превью видеоинструкции.", "tag": "ux"}, {"id": "7543b28e3848", "text": "Уменьшить визуальный шум и количество мелкого нечитаемого текста в превью видеоинструкции.", "tag": "ux"}, {"id": "4b254caa1cea", "text": "Создать кастомную обложку для видеоинструкции, убрать кнопку Play из маленького превью.", "tag": "ux"}, {"id": "bc1671de4c39", "text": "Интегрировать функционал рекомендаций анализов в существующие личные кабинеты врачей телемедицины.", "tag": "ux"}]}]}, {"id": "s20260630p1i13", "date": "2026-06-30", "dateLabel": "30 июня", "meta": "30 июня 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260630p1i13-0-0", "author": "Кариша", "title": "Компонент загрузки файлов", "tasks": [{"id": "5f8efe5535d8", "text": "Убрать сообщение «вы загрузили максимальное количество файлов» при загрузке одного обязательного файла.", "tag": "ux"}, {"id": "41e7ca36dcf0", "text": "Раздизейблить поле загрузки файла, если оно не должно быть задизейблено.", "tag": "ux"}, {"id": "4fd7b062f312", "text": "Пересмотреть логику уведомления о максимальном количестве файлов для случая с одним файлом.", "tag": "ux"}, {"id": "a52bfde9b1bd", "text": "Рассмотреть паттерн, когда дроп-зона просто дизейблится или пропадает после добавления файла.", "tag": "ux"}, {"id": "195fd7b00524", "text": "Уточнить логику поведения при одновременной загрузке файлов, превышающей лимит.", "tag": "dev"}, {"id": "b1138a2a98ed", "text": "Уточнить у разработки возможность реализации логики ограничения количества файлов при загрузке через системное окно или drag-n-drop.", "tag": "dev"}, {"id": "4fc123483f8a", "text": "Рассмотреть паттерн, когда дроп-зона просто дизейблится без дополнительного сообщения.", "tag": "ux"}, {"id": "8ab01a614c69", "text": "Проверить, почему нижние элементы с файлами задизейблены, если лимит не достигнут.", "tag": "ux"}, {"id": "722e70c36149", "text": "Добавить текстовое уведомление о максимальном количестве файлов в дроп-зону до загрузки.", "tag": "ux"}, {"id": "8e05db3aa5b3", "text": "Не показывать сообщение о максимальном количестве файлов, если лимит равен одному.", "tag": "ux"}, {"id": "6ed10df2303e", "text": "Разделить логику отображения для загрузки одного и нескольких файлов.", "tag": "ux"}, {"id": "77107c058fb0", "text": "Поправить нейминг в дроп-зоне для случая с одним файлом — использовать «перетащите или выберите файл».", "tag": "ux"}, {"id": "4f95ffa75f33", "text": "Собрать референсы по работе дроп-зон из других дизайн-систем — Альфа-Банк, Авито, МТС, Яндекс.", "tag": "ux"}, {"id": "f232561e968f", "text": "Продолжить ресерч паттернов для компонента загрузки файлов.", "tag": "ux"}]}, {"id": "s20260630p1i13-1-0", "author": "Аня", "title": "Сервис беременности - навигация и профиль (десктоп)", "tasks": [{"id": "2c8d13173925", "text": "Уменьшить отступы между пунктами в навигации.", "tag": "ux"}, {"id": "ce37d9fe27c0", "text": "Уточнить, откуда берутся карточки в профиле — из медкарты или свои.", "tag": "ux"}, {"id": "73b66d0574f1", "text": "Обеспечить единый визуальный стиль для контента, подтягиваемого из медкарты, на разных страницах.", "tag": "ux"}, {"id": "e8b39ce82627", "text": "Уточнить возможность доработки фронта медкарты для единого отображения.", "tag": "dev"}, {"id": "a2bb3f052f56", "text": "Уточнить, какие именно данные будут подтягиваться из медкарты, например, план лечения.", "tag": "ux"}, {"id": "72103dab39e3", "text": "Различить визуально сервис беременности от медкарты, чтобы избежать путаницы у пользователей.", "tag": "ux"}, {"id": "80cff0c08228", "text": "Добавить фильтр для обследований, связанных с беременностью, в медкарте.", "tag": "ux"}, {"id": "fd70a7159a4c", "text": "Уточнить, куда ведут кнопки «Записаться» и «Добавить файл» в дублированной медкарте.", "tag": "ux"}, {"id": "60ba7d839959", "text": "Пересмотреть решение с дублированием сервисов из-за его сложности для разработки.", "tag": "dev"}, {"id": "f68655d350c1", "text": "Уточнить у разработки, насколько реализуемо дублирование функционала.", "tag": "dev"}, {"id": "d3f4c7ad2888", "text": "Уточнить, почему в выдаче врачей отсутствуют фильтры и клиники.", "tag": "ux"}, {"id": "19e14722aa62", "text": "Добавить кнопку «Изменить фильтры» и отображение города в выдаче врачей.", "tag": "ux"}, {"id": "36b0823a2273", "text": "Уточнить логику интеграции с Док-Доком для получения списка врачей и фильтров.", "tag": "dev"}, {"id": "919979ca9b9d", "text": "Согласовать с продакт-менеджером Ваней реалистичные сроки и объем работ по дублированию функционала.", "tag": "ux"}, {"id": "debbd3c31b55", "text": "Сделать более очевидным расположение истории посещений в профиле и показать весь функционал профиля.", "tag": "ux"}]}, {"id": "s20260630p1i13-1-1", "author": "Аня", "title": "Сервис беременности - неавторизованная зона", "tasks": [{"id": "f7783c5d8200", "text": "Пересмотреть копирайт подзаголовка «Храните результаты».", "tag": "ux"}, {"id": "04229b4755c4", "text": "Убрать нижний таб-бар в неавторизованной зоне, так как его вкладки бесполезны без авторизации.", "tag": "ux"}, {"id": "f592fb4b7652", "text": "Изменить заголовок «Добрый день, авторизуйтесь» на более конкретный CTA, например, «Войти и настроить план».", "tag": "ux"}, {"id": "187dc9285f79", "text": "Переработать главную страницу неавторизованного пользователя, сделав ее более промовой и отличающейся от авторизованной.", "tag": "ux"}, {"id": "8c42c0c6d682", "text": "Сделать главную страницу неавторизованного пользователя промовой, демонстрирующей возможности сервиса — план по неделям, карточки врачей, анализы, календарь.", "tag": "ux"}, {"id": "60908d4a2e79", "text": "Проконсультироваться с SEO-специалистом по наполнению неавторизованных страниц SEO-текстами.", "tag": "ux"}, {"id": "383466419987", "text": "Расписать возможности сервиса на главной странице неавторизованной зоны в промовом стиле, не дублируя фактический контент.", "tag": "ux"}]}, {"id": "s20260630p1i13-1-2", "author": "Аня", "title": "Календарь (пустое состояние)", "tasks": [{"id": "3971b275fcee", "text": "Добавить в пустое состояние календаря текст, объясняющий, что записи появятся здесь.", "tag": "ux"}, {"id": "c5d6aaead6bd", "text": "Вернуть отображение недель внутри даты в календаре.", "tag": "ux"}]}]}, {"id": "s20260625p2i14", "date": "2026-06-25", "dateLabel": "25 июня", "meta": "25 июня 2026 · Ревью ч.2 · чт", "designersCount": 1, "fun": {}, "projects": [{"id": "s20260625p2i14-0-0", "author": "Аня", "title": "Макеты", "tasks": [{"id": "c5d8a415473c", "text": "Прости 😔 в этот четверг ты показывала макеты, а твой список правок забыли включить в конспект. Показ засчитали. Если помнишь правки — скинь, добавим их сюда.", "tag": "ux"}]}]}, {"id": "s20260618p2i15", "date": "2026-06-18", "dateLabel": "18 июня", "meta": "18 июня 2026 · Ревью ч.2 · чт", "designersCount": 1, "fun": {}, "projects": [{"id": "s20260618p2i15-0-0", "author": "Ксюша", "title": "Сбор корзины по фото", "tasks": [{"id": "cb0ff698e126", "text": "Переформулировать текст УТП, чтобы было понятно, что собирается корзина анализов по фото, списку или файлу", "tag": "ux"}, {"id": "7e968d961cdf", "text": "Добавить объяснение, что загружать нужно фото, PDF-файл, список в печатном виде", "tag": "ux"}, {"id": "fe244e02687a", "text": "Найти оптимальный размер и расположение блока для сбора корзины по фото", "tag": "ux"}, {"id": "6bb8927be5d3", "text": "Попробовать вариант иконки без пунктирной обводки для блока сбора корзины по фото", "tag": "ux"}, {"id": "8c906624409b", "text": "Сделать блок сбора корзины по фото более заметным и иллюстративным, чтобы он не проваливался на фоне других элементов", "tag": "ux"}, {"id": "8a2e97497458", "text": "Проверить и скорректировать выравнивания элементов в макете", "tag": "ux"}, {"id": "81daa66da708", "text": "Рассмотреть вариант размещения блока «И помощник» в виде баннера сверху для лучшего фокуса", "tag": "ux"}, {"id": "6ceae0edf810", "text": "Разработать виджет для «И помощника», который будет нативным и заметным, вместо классического баннера",
