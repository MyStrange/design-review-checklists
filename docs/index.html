"tag": "ux"}, {"id": "971c4026a34c", "text": "Увеличить контраст блока сбора корзины по фото, чтобы он не терялся", "tag": "ux"}, {"id": "90b1bb29ddb5", "text": "Использовать формулировку «по списку» для большей понятности", "tag": "ux"}, {"id": "8518f03e4e42", "text": "Перенести блок «И помощник» с главной страницы в контекст поиска, чтобы избежать визуального шума и лишних офферов на главной", "tag": "ux"}, {"id": "ecedd0b329fe", "text": "Если блок остается на главной, сделать его большим и акцентным, чтобы он выделялся", "tag": "ux"}, {"id": "3e2561b37215", "text": "Учесть влияние блока «И помощник» на текущее тестирование новой главной страницы", "tag": "ux"}, {"id": "dce7527b4dac", "text": "Рассмотреть вариант размещения «И помощника» рядом со строкой поиска, как отдельную кнопку", "tag": "ux"}, {"id": "46d80056eb76", "text": "Продумать узнаваемость логотипа «И помощника» для веб-версии", "tag": "ux"}, {"id": "a607c9774216", "text": "Добавить онбординг-тултип для объяснения функционала «И помощника» при первом появлении", "tag": "ux"}, {"id": "e2550152eaef", "text": "Использовать стандартный компонент дропбокса из дизайн-системы, не перекрашивая его", "tag": "ux"}, {"id": "6923db9cb6e3", "text": "Обеспечить контрастность кнопки загрузки файла на фоне дропбокса", "tag": "ux"}, {"id": "373547d5940f", "text": "Переиспользовать ДС-очный блок для загрузки файла, разместив пояснения внутри него", "tag": "ux"}, {"id": "a23c1a389ea9", "text": "Избегать дублирования текста «загрузите файл» и «загрузите фото»", "tag": "ux"}, {"id": "65ff3381a519", "text": "Сделать заголовок экрана более ориентированным на целевое действие, например, «Загрузите файл»", "tag": "ux"}, {"id": "4d63b41fe0ec", "text": "Перенести важные пояснения о форматах файлов непосредственно в тело дропбокса или заголовок, чтобы они были заметнее", "tag": "ux"}, {"id": "ff63262b438f", "text": "Рассмотреть заголовок «Загрузите файл, подберем анализы»", "tag": "ux"}, {"id": "5eebe3a7f979", "text": "Поиграть с композицией и размещением Куси, чтобы использовать ДС-овский компонент дропбокса без потери Куси", "tag": "ux"}, {"id": "02d490c8e786", "text": "Уточнить у Никиты или в спеке ограничения по количеству загружаемых файлов", "tag": "ux"}, {"id": "4573be7342e6", "text": "Указать ограничение на количество загружаемых файлов, если оно есть", "tag": "ux"}]}, {"id": "s20260618p2i15-0-1", "author": "Ксюша", "title": "Корзина (редизайн)", "tasks": [{"id": "5f57be13d191", "text": "Сделать выбор города более заметным и кликабельным", "tag": "ux"}, {"id": "8fe1c639cb5c", "text": "Унифицировать использование стрелочек или других индикаторов кликабельности для выбора города", "tag": "ux"}, {"id": "dd062cdd98a4", "text": "Рассмотреть возможность переноса выбора города в модалку или на отдельную страницу выбора лаборатории", "tag": "ux"}, {"id": "f91d80cae49e", "text": "Сделать выбор города полноценным полем или крупным элементом, а не ссылкой", "tag": "ux"}, {"id": "fcfadcfc3d38", "text": "Устранить путаницу в шагах прогресс-бара, чтобы было понятно, на каком этапе находится пользователь", "tag": "ux"}, {"id": "39a9883b497c", "text": "Пересмотреть цветовое кодирование иконок в прогресс-баре, чтобы активный и следующий шаги четко различались", "tag": "ux"}, {"id": "238a27a12033", "text": "Сделать прогресс-бар более явно относящимся к конкретным шагам, а не ко всей странице", "tag": "ux"}, {"id": "2577ca20e804", "text": "Скорректировать контент и флоу корзины в соответствии с логикой прогресс-бара", "tag": "ux"}, {"id": "01e6f0926dba", "text": "Обсудить с Надей целесообразность вынесения текущих изменений корзины на продакт-челлендж, так как они могут быть недостаточными для полноценного редизайна", "tag": "ux"}, {"id": "7cdb3ca3ce35", "text": "Рассмотреть изменение флоу корзины: выбор лаборатории, затем выбор пациента, затем способ оплаты", "tag": "ux"}, {"id": "d895423d7c4c", "text": "Добавить возможность смены профиля пациента (включая запись ребенка) на более раннем этапе корзины", "tag": "ux"}, {"id": "0ee3a6d69d19", "text": "Разделить шаги «Пациент» и «Оплата» в прогресс-баре и на соответствующих экранах", "tag": "ux"}, {"id": "72df422d1d7a", "text": "Улучшить механизм смены города, чтобы он был очевиден для пользователя", "tag": "ux"}, {"id": "56b233fa377d", "text": "Заменить иконку «инфо» на более понятную стрелочку «подробнее» для расшифровки, ведущую в модалку", "tag": "ux"}, {"id": "eafe0838e275", "text": "Подсветить кликабельность элемента «консультация» и объяснить, что она необязательна, но не удаляется по юридическим причинам", "tag": "ux"}, {"id": "623ae799582d", "text": "Пересмотреть решение об удалении блока «Подготовка» из корзины, так как это может быть блокером для пользователей", "tag": "ux"}, {"id": "6cc52250bca5", "text": "Рассмотреть перенос блока «Выгода» на экран оплаты, если это не противоречит статистике использования промокодов", "tag": "ux"}, {"id": "8390af1e431a", "text": "Поменять местами блоки «Подготовка» и «Выгода» для улучшения логики расположения", "tag": "ux"}, {"id": "178b8aed1537", "text": "Объединить несколько заборов биоматериала в один блок, если это возможно", "tag": "ux"}, {"id": "e627338dfd5d", "text": "Удалить лишние пояснительные тексты, например, «необходимо для оказания», чтобы сделать интерфейс чище", "tag": "ux"}, {"id": "34a4f1afe795", "text": "Добавить тултип с пояснением о сроках готовности анализов, учитывающий праздничные и выходные дни, а также день взятия биоматериала", "tag": "ux"}, {"id": "d8f86e0674ee", "text": "Проанализировать клики на срок готовности и, если процент высокий, рассмотреть возможность удаления основного текста о сроках, оставив только тултип", "tag": "ux"}, {"id": "f6776caecd8d", "text": "Уточнить юридическую важность текста о сроках готовности анализов", "tag": "ux"}, {"id": "36ce03d795c1", "text": "Унифицировать стиль иконки чата по всему сайту, используя версию на белом фоне в кружочке", "tag": "ux"}, {"id": "26733b27a4c0", "text": "Разработать разветвление функционала чата при нажатии: сбор по фото, техподдержка и другие опции, чтобы избежать нескольких иконок чата", "tag": "ux"}]}]}, {"id": "s20260611p2i16", "date": "2026-06-11", "dateLabel": "11 июня", "meta": "11 июня 2026 · Ревью ч.2 · чт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260611p2i16-0-0", "author": "Кариша", "title": "Редизайн страницы с врачами / Добавление врача", "tasks": [{"id": "d213f244cce7", "text": "Открывать модалку с отдельными полями для добавления нового врача.", "tag": "ux"}, {"id": "8712a052e97a", "text": "Разбить поле ФИО на три отдельных поля: фамилия, имя, отчество.", "tag": "ux"}, {"id": "01fa178473cc", "text": "Реализовать предзаполнение полей ФИО при переходе на форму добавления нового врача.", "tag": "dev"}, {"id": "919228fd9843", "text": "При добавлении нового врача переводить пользователя на страницу редактирования врача с пустыми полями.", "tag": "ux"}, {"id": "1c13fd107e76", "text": "Добавить кнопку для создания нового врача, даже если найдены полные тезки.", "tag": "ux"}, {"id": "51eacb54b6aa", "text": "Рассмотреть возможность убрать модалку поиска врача и интегрировать поиск прямо на экране списка врачей.", "tag": "ux"}, {"id": "0eb30aa84311", "text": "Проверить и унифицировать размеры кнопок на экране.", "tag": "ux"}, {"id": "172c4032d5b2", "text": "Реализовать подтягивание и наследование данных о враче из базы (стаж, опыт, специализация) при добавлении в новую клинику.", "tag": "ux"}]}, {"id": "s20260611p2i16-0-1", "author": "Кариша", "title": "Блок специализации (в форме добавления/редактирования врача)", "tasks": [{"id": "6f1f7c55de31", "text": "Улучшить визуальную группировку полей возраста для детей, чтобы они явно относились к чекбоксу «принимает детей».", "tag": "ux"}, {"id": "9f81c7f356a4", "text": "Изменить формулировку «принимает выезд на дом» на «выезжает на дом».", "tag": "ux"}, {"id": "1d52a8a91174", "text": "Уменьшить количество пунктов и избавиться от артефактных чекбоксов, которые ломают страницу.", "tag": "ux"}, {"id": "05a637f32d5a", "text": "Изменить формулировку «амбулаторный прием» на более понятную, например, «прием в клинике».", "tag": "ux"}, {"id": "b51eef0a0550", "text": "Реализовать предвыбор для наиболее частотных опций (например, «прием в клинике» по умолчанию).", "tag": "ux"}, {"id": "df8dc0db8a1f", "text": "Удалить чекбокс «ведет коммерческий прием» и автоматически проставлять этот статус при указании стоимости приема.", "tag": "ux"}, {"id": "4e342388e1e0", "text": "Связать поля стоимости приема с чекбоксами, чтобы они появлялись динамически при выборе соответствующей опции.", "tag": "ux"}, {"id": "1a027fff97fa", "text": "Пересмотреть расположение полей возраста для детей, чтобы они не создавали визуальных разрывов и были компактнее.", "tag": "ux"}, {"id": "c52281b2c474", "text": "Выровнять чекбоксы «ведет коммерческий прием» и «ведет амбулаторный прием» на одном уровне.", "tag": "ux"}, {"id": "54ed41453cf8", "text": "Сгруппировать чекбоксы по смыслу и расположить их рядом или блоками.", "tag": "ux"}, {"id": "31c7ee58635e", "text": "Пересмотреть название блока «Специализации», так как он содержит не только специализации, но и типы приема.", "tag": "ux"}, {"id": "86f7e67dbda3", "text": "Сделать чекбоксы «принимает детей» и «принимает взрослых» взаимоисключающими, так как они влияют на цену и специализацию.", "tag": "ux"}, {"id": "e305d4b9c401", "text": "Рассмотреть возможность добавления кнопки «Дублировать специализацию» для ускорения заполнения похожих данных.", "tag": "ux"}, {"id": "f5827c63863b", "text": "Уточнить, к какому типу приема относится указанная стоимость (например, «цена за прием в клинике», «цена за выезд на дом»).", "tag": "ux"}, {"id": "784d179e78f9", "text": "Реализовать зависимость доступности чекбоксов «принимает детей»/«принимает взрослых» от выбранной специализации.", "tag": "ux"}, {"id": "d5f624b0048f", "text": "Проработать архитектуру и логику отображения полей и чекбоксов в блоке специализаций, учитывая взаимосвязи и цены.", "tag": "ux"}, {"id": "7bb2150a8bde", "text": "Внедрить прогрессивное раскрытие информации в блоке специализаций: показывать дополнительные поля и опции по мере выбора основных.", "tag": "ux"}, {"id": "06c50c162d31", "text": "Рассмотреть возможность объединения информации о приеме детей и взрослых в одной карточке специализации с динамическим раскрытием цен.", "tag": "ux"}]}, {"id": "s20260611p2i16-1-0", "author": "Костя", "title": "Лендинг «Паспорт здоровья» (Зожники)", "tasks": [{"id": "f0538fc4e729", "text": "Убрать излишнюю информацию о связи каждого анализа с несколькими симптомами, чтобы снизить когнитивную нагрузку.", "tag": "ux"}, {"id": "d01b48e11ac0", "text": "Рассмотреть возможность предоставления готовых подборок анализов для конкретных кейсов/симптомов.", "tag": "ux"}, {"id": "a1e94e23765c", "text": "Добавить возможность скрывать/раскрывать подробную информацию об анализах и их связи с симптомами.", "tag": "ux"}, {"id": "3febd34b7873", "text": "Разработать общее саммари рекомендаций (анализы, питание, образ жизни) на основе выбранных симптомов, возможно, с использованием ИИ.", "tag": "ux"}, {"id": "a362cf65ce62", "text": "Отказаться от детальной привязки анализов к симптомам на этапе MVP, отложить до внедрения ИИ.", "tag": "ux"}, {"id": "07e053d86d82", "text": "Переработать иконку со списком, чтобы она соответствовала общему стилю и не выглядела «мультяшной» или «полосатой».", "tag": "ux"}, {"id": "ff4ad6edd870", "text": "Убрать объем и полоски из иконки со списком, сделать ее залитой, без лишних деталей.", "tag": "ux"}, {"id": "9221e98630cc", "text": "Изучить реальные цвета жидкостей в пробирках для анализов, чтобы иконка была более реалистичной.", "tag": "ux"}]}]}, {"id": "s20260609p1i17", "date": "2026-06-09", "dateLabel": "9 июня", "meta": "9 июня 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260609p1i17-0-0", "author": "Аня", "title": "Главная", "tasks": [{"id": "e3d0e42990f3", "text": "Сохранить текущий дизайн карточек, не углубляться в проработку визуала и метафор.", "tag": "ux"}, {"id": "fa854a871adf", "text": "Проверить, помещается ли текст сложных направлений, например «эндокринолог», в карточки врачей.", "tag": "ux"}, {"id": "8777d4c2e080", "text": "Убедиться, что иконки в карточках врачей правильно выровнены и расположены.", "tag": "ux"}, {"id": "144da6ad7577", "text": "Удалить буллеты из однострочных текстовых элементов в разделах «Обследования» и «Анализы».", "tag": "ux"}, {"id": "e141e3c00ef7", "text": "Объединить несколько коротких текстовых элементов в один абзац или блок там, где это уместно, вместо использования буллетов.", "tag": "ux"}, {"id": "4d200259b0b3", "text": "Рассмотреть использование карточек без серого фона для лучшей видимости.", "tag": "ux"}, {"id": "bd26c577fb6f", "text": "Пересмотреть объединение комплексных и единичных анализов в один визуальный стиль; изучить отдельные визуализации для обязательных комплексов и опциональных рекомендаций.", "tag": "ux"}]}, {"id": "s20260609p1i17-0-1", "author": "Аня", "title": "Календарь", "tasks": [{"id": "f9444d2bc0e1", "text": "Уменьшить высоту ячеек календаря, чтобы на экране помещалось больше дат.", "tag": "ux"}, {"id": "73e9aad57f30", "text": "Попробовать сделать отображение недели в виде более тонкой, маленькой плашки, как в мобильной версии календаря.", "tag": "ux"}, {"id": "2f2160f8b45e", "text": "Отрегулировать верхние и нижние отступы для отображения недели, чтобы сделать его тоньше.", "tag": "ux"}, {"id": "f13afe490c0e", "text": "Уточнить отображение номеров недель, например «8-я неделя», чтобы избежать путаницы с днями недели.", "tag": "ux"}, {"id": "03b66e669d22", "text": "Уточнить у продакта или стейкхолдеров, какой вид календаря тестировать или внедрять.", "tag": "ux"}, {"id": "31ad670d3ca0", "text": "Улучшить ясность того, что представление таймлайна прокручивается.", "tag": "ux"}]}, {"id": "s20260609p1i17-0-2", "author": "Аня", "title": "Врачи", "tasks": [{"id": "92f64778c285", "text": "Подтвердить решение о перенаправлении на «Док-док» для записи к врачам вместо отображения всех врачей в текущем интерфейсе.", "tag": "ux"}]}, {"id": "s20260609p1i17-1-0", "author": "Ксюша", "title": "Внедрение ИИшки на веб", "tasks": [{"id": "352604c19613", "text": "Разработать единую карточку для входа в ИИ-помощник на главной странице, ведущую на отдельную страницу выбора функций.", "tag": "ux"}, {"id": "edb8dbdc31fb", "text": "Упростить визуальный дизайн карточки входа в ИИ-помощник, уменьшив количество элементов для более чистого и единого вида.", "tag": "ux"}, {"id": "65d4546a0184", "text": "Рассмотреть возможность добавления предварительного просмотра области загрузки файла непосредственно на точке входа, вместо просто кнопки.", "tag": "ux"}, {"id": "4cc62fcdd31b", "text": "Выделить возможности ИИ-помощника, например «соберет корзину по списку», более заметным текстом, а не мелким серым.", "tag": "ux"}, {"id": "984b615b2244", "text": "Уточнить действие в кнопке или тексте «Собрать корзину», например «Загрузить фото» или «Ввести список».", "tag": "ux"}, {"id": "114e1212d2e9", "text": "Обеспечить одинаковую высоту кнопок или блоков, даже если длина текста варьируется, чтобы избежать визуальных несоответствий.", "tag": "ux"}, {"id": "86c2c5b2c302", "text": "Пересмотреть название и визуальную согласованность с «полноценным ИИ-помощником», если текущая функциональность ограничена сканированием файлов или списков.", "tag": "ux"}, {"id": "32011cc1fb10", "text": "Избегать жесткого следования реализации ИИ-помощника в приложении, так как функциональность на вебе отличается; исследовать альтернативные веб-специфичные дизайны.", "tag": "ux"}, {"id": "42ad0dab46f6", "text": "Уменьшить количество действий или кнопок на экране; рассмотреть единую точку входа, которая ведет к внутреннему выбору функций ИИ.", "tag": "ux"}, {"id": "2c1f902246ed", "text": "Реализовать анимацию текста в блоке ИИ-помощника для динамического отображения различных функций.", "tag": "ux"}, {"id": "b49cf8c93159", "text": "Рассмотреть возможность добавления баннера ИИ-помощника в слайдер на главной странице для лучшей видимости, если это возможно в рамках текущих ограничений разработки.", "tag": "ux"}, {"id": "a706443258d9", "text": "Добавить поле для ручного ввода списков анализов текстом, в дополнение к загрузке файла.", "tag": "ux"}, {"id": "2c331916d724", "text": "Уточнить у Никиты, поддерживается ли текстовый ввод, и разработать соответствующую текстовую область, если да.", "tag": "ux"}, {"id": "dc7f6a658478", "text": "Улучшить UI/UX экрана загрузки файла или ввода текста, возможно, имитируя интерфейс чата для ввода текста и используя стандартную иконку вложения файла для загрузки.", "tag": "ux"}]}]}, {"id": "s20260602p1i18", "date": "2026-06-02", "dateLabel": "2 июня", "meta": "2 июня 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260602p1i18-0-0", "author": "Аня", "title": "Сервис для беременных", "tasks": [{"id": "b12832c30418", "text": "Обсудить с Кариной, является ли сервис информационным или сервисом допродажи услуг.", "tag": "discuss"}, {"id": "d58e0005544e", "text": "Переработать кружочки с неделями, они выглядят «народно» и спорят с цветами.", "tag": "ux"}, {"id": "e73b10d9edd1", "text": "Сделать блок «информация по неделям» цельным, чтобы было понятно его начало и конец.", "tag": "ux"}, {"id": "9f94b3224a4d", "text": "Сократить тексты в блоке «информация по неделям» — например, «Встаньте на учет», «Прием врачей».", "tag": "ux"}, {"id": "256ab4059186", "text": "Переработать визуал блока «малыш, мама, спорт и еда» — размеры шрифтов, жирность.", "tag": "ux"}, {"id": "2ec6bccd368d", "text": "Подумать над визуализацией контента внутри блока «малыш, мама, спорт и еда» — использовать паттерн с меняющимся контентом внутри блока.", "tag": "ux"}, {"id": "89b1a7767570", "text": "Разделить «мама, малыш» и «спорт, еда» на разные иерархические уровни, «спорт, еда» вынести в отдельный блок.", "tag": "ux"}, {"id": "1bc283a7af4d", "text": "Добавить заголовок или пояснение к блоку «информация по неделям» — например, «что происходит», «что меняется».", "tag": "ux"}, {"id": "659e0a3bf057", "text": "Переосмыслить навигационную логику блока «информация по неделям», так как «приемы у врачей» не являются информацией.", "tag": "ux"}, {"id": "e3462ce19908", "text": "Сделать связку между выбором недели и меняющимся контентом более очевидной, объединить в одну историю/карточку.", "tag": "ux"}, {"id": "58a60ada7592", "text": "Переименовать блок «все услуги» на что-то вроде «возможно, вам нужно что-то еще» или «посмотрите дополнительно».", "tag": "ux"}]}, {"id": "s20260602p1i18-0-1", "author": "Аня", "title": "Страница выдачи врачей/обследований", "tasks": [{"id": "66597de40763", "text": "Обсудить с Кариной, нужны ли в принципе тут какие-либо выдачи врачей/обследований.", "tag": "discuss"}, {"id": "617de0c65ea1", "text": "Критически оценить запросы Карины по функционалу, учитывая сложность разработки и поддержки.", "tag": "discuss"}, {"id": "380b23609254", "text": "Если выдачи нужны, рассмотреть вариант с хардкодом 3-5 топ-врачей/клиник и перенаправлением на ДокДок/СберЗдоровье.", "tag": "dev"}, {"id": "fbc341ae1d37", "text": "Не тащить все специальности и обследования из ДокДока/СберЗдоровья, ограничиться релевантными для беременных.", "tag": "dev"}, {"id": "779308a37a7a", "text": "Рассмотреть использование партнерского виджета для встраивания выдачи.", "tag": "dev"}, {"id": "bf1e5f4acb26", "text": "Учесть, что макеты Нади по стоматологии не утверждены и ее кейс с 3 клиниками может не подойти.", "tag": "discuss"}]}, {"id": "s20260602p1i18-1-0", "author": "Костя", "title": "Паспорт здоровья", "tasks": [{"id": "91283ea36503", "text": "Улучшить читаемость текста «Ожидаем результата анализов» и «два показателя требуют внимания» на фиолетовом фоне.", "tag": "ux"}, {"id": "120c39d0f81e", "text": "Перенести бейджи «Ожидаем результата анализов» и «два показателя требуют внимания» к блоку «Мои показатели».", "tag": "ux"}, {"id": "2d5c2aa60aaa", "text": "Рассмотреть вариант белых бейджей с ярким текстом.", "tag": "ux"}, {"id": "8ced8d9170c1", "text": "Обсудить с разработкой сложность реализации всех состояний чарта.", "tag": "dev"}, {"id": "ba546482f41b", "text": "Пересмотреть расположение кнопки «Настроить» на карточках анализов.", "tag": "ux"}, {"id": "425c6652fb48", "text": "Рассмотреть вариант с иконкой карандаша или тремя точками для настройки периода, если это не ежедневное действие.", "tag": "ux"}, {"id": "8fcb45de2702", "text": "Объединить информацию о периоде — «один раз в месяц» и кнопку «Настроить» визуально, чтобы было понятно, что это настройка периода.", "tag": "ux"}, {"id": "ab6b959c64e7", "text": "Пересмотреть компоновку элементов внутри карточек анализов, чтобы избежать «бургера» из разных размеров шрифтов.", "tag": "ux"}, {"id": "e1b17c9e411b", "text": "Для анализов без настроенного повторения использовать более явный призыв к действию, например, «Настроить повторение».", "tag": "ux"}]}]}, {"id": "s20260528p2i19", "date": "2026-05-28", "dateLabel": "28 мая", "meta": "28 мая 2026 · Ревью ч.2 · чт", "designersCount": 3, "fun": {}, "projects": [{"id": "s20260528p2i19-0-0", "author": "Надя", "title": "Чистка — Шапка", "tasks": [{"id": "c97a5b23a6f3", "text": "Убрать руки с изображения барышни.", "tag": "ux"}, {"id": "6026bb3c3ea6", "text": "Попросить сделать свет на изображении барышни помягче.", "tag": "ux"}, {"id": "3b2cb7eeddf7", "text": "Решить проблему с обрезкой лица барышни на мобильных экранах.", "tag": "ux"}, {"id": "d63a4f6a91ed", "text": "Рассмотреть вариант перемещения изображения барышни вверх на мобильных экранах.", "tag": "ux"}]}, {"id": "s20260528p2i19-0-1", "author": "Надя", "title": "Выбор метро — Чипсы", "tasks": [{"id": "ff1b777dc602", "text": "Пересмотреть логику отображения чипсов и выбранного состояния в поиске метро, чтобы избежать дублирования.", "tag": "ux"}, {"id": "9e4afba84293", "text": "Усилить визуальный вес блока выбора метро.", "tag": "ux"}, {"id": "ee02ed54d465", "text": "Подумать, как сделать блок выбора метро более заметным, чтобы пользователь понимал, что к нему можно подступиться.", "tag": "ux"}]}, {"id": "s20260528p2i19-0-2", "author": "Надя", "title": "Новые карточки клиник — Десктоп", "tasks": [{"id": "7b6e0e46b63a", "text": "Добавить большую картинку на карточку клиники, как просил продакт.", "tag": "ux"}, {"id": "18720b3c31da", "text": "Пересмотреть расположение элементов на карточке клиники, чтобы избежать размазанности и чрезмерного акцента на АИ-блоке.", "tag": "ux"}, {"id": "f7d0fe7c8667", "text": "Сократить длину дивайдера или полностью его убрать на карточке клиники, чтобы он не дробил фотку и АИ-блок.", "tag": "ux"}, {"id": "03ac7285ccd6", "text": "Оставить дивайдер по ширине кнопки «Записаться в клинику».", "tag": "ux"}, {"id": "0c394337624e", "text": "Пересмотреть верстку названия услуги и цены на карточке, чтобы они не были оторваны друг от друга.", "tag": "ux"}, {"id": "ea240fb32ab8", "text": "Продумать, как подтверждать пользователю, на какую услугу он записывается, особенно при предоплате.", "tag": "ux"}]}, {"id": "s20260528p2i19-1-0", "author": "Глеб", "title": "Карты врачей в приложении", "tasks": [{"id": "f4da83b0c634", "text": "Обсудить с Артемом бизнес-цели карт, чтобы синхронизировать ожидания с Ваней.", "tag": "discuss"}, {"id": "dc6e0c317eb6", "text": "Синхронизироваться и прийти к единому решению по логике кластеризации на картах — по врачам или клиникам.", "tag": "discuss"}, {"id": "909db81836a4", "text": "Уточнить у Кости логику кластеров на картах для услуг и анализов.", "tag": "discuss"}, {"id": "b476b99cdb84", "text": "Продумать, как реализовать страницу клиники по клику на карту, приближенную к странице врача.", "tag": "ux"}, {"id": "ae4ebe878d97", "text": "Уточнить у Кости, почему отзывы на карточках серые и некликабельные.", "tag": "discuss"}, {"id": "05e4a5bcba6f", "text": "Изучить возможности кастомизации тем карт — цвета, стили для соответствия UI приложения.", "tag": "dev"}, {"id": "58e44fd29043", "text": "Рассмотреть возможность добавления клиник в избранное.", "tag": "ux"}, {"id": "4e0741086c8f", "text": "Учесть логику отображения ближайших клиник, которые не входят в выбранную гео-зону, но показываются со специальной обводкой.", "tag": "ux"}]}, {"id": "s20260528p2i19-2-0", "author": "Аня", "title": "Сервис цифрового ведения беременности", "tasks": [{"id": "675b7a9c6d53", "text": "Сделать раздел с информацией для беременных более интересным и содержательным.", "tag": "ux"}, {"id": "fe2d9ac0ab35", "text": "Перенести функционал записи к врачам и обследованиям на главную страницу, под выбранную неделю.", "tag": "ux"}, {"id": "9c6d0fb37931", "text": "Вынести платные блоки про запись выше на главной странице.", "tag": "ux"}, {"id": "1b56720c23a4", "text": "Рассмотреть возможность удаления стрелочек на онбординге, полагаясь на паттерн пролистывания.", "tag": "ux"}, {"id": "fd806d9878c5", "text": "Пересмотреть блюр на экране авторизации, возможно, показать часть контента для демонстрации ценности.", "tag": "ux"}, {"id": "49aaf2f1623a", "text": "Проверить копирайт «лучшие врачи» на соответствие правилам.", "tag": "discuss"}, {"id": "e4dc6057deee", "text": "Пересмотреть использование элемента «выбранный» — обводка для единообразия, особенно для блока авторизации.", "tag": "ux"}, {"id": "3250690dc1d4", "text": "Переработать стиль плашки «минус 20%» на календаре, чтобы она соответствовала новой цветовой палитре.", "tag": "ux"}, {"id": "424e9eeaa7d8", "text": "Облегчить стиль стандартных иконок — КГ, УЗИ для соответствия новой, более легкой стилистике сервиса.", "tag": "ux"}, {"id": "6b12a0bdcfa2", "text": "Рассмотреть изменение цветовой палитры серого на более «няшный» оттенок — например, серо-сиреневый.", "tag": "ux"}, {"id": "65d3c732556a", "text": "Проверить правила типографики для использования тире между цифрами — например, «1-13 неделя».", "tag": "ux"}, {"id": "3e20f0065637", "text": "Проверить наличие пробелов вокруг тире в диапазонах недель — например, «5 - 13».", "tag": "ux"}, {"id": "5a061626d5f0", "text": "Причесать цветные иконки, чтобы они были консистентны с новой стилистикой.", "tag": "ux"}, {"id": "df6371043527", "text": "Разместить допродажные блоки — запись к врачам, обследования на главной странице под информацией для мамы.", "tag": "ux"}, {"id": "13a5e0563583", "text": "Сделать плашку под «первым триместром» чуть светлее, чтобы она отличалась от основного фона.", "tag": "ux"}, {"id": "e999392bbbe3", "text": "Пересмотреть использование контура «выбранный» для «Чата с врачом» для консистентности.", "tag": "ux"}, {"id": "b6852a7389d4", "text": "Обеспечить консистентность в отображении приблизительных и точных дат — например, «приблизительный вес» vs «точная дата родов».", "tag": "ux"}, {"id": "8232e73be1fb", "text": "Изменить текст «Дата родов» на «Планируемая дата родов» — ПДР для большей точности.", "tag": "ux"}, {"id": "09949d74e990", "text": "Рассмотреть добавление большего количества иллюстраций фруктов/ягод для каждой недели беременности.", "tag": "ux"}]}]}, {"id": "s20260526p1i20", "date": "2026-05-26", "dateLabel": "26 мая", "meta": "26 мая 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260526p1i20-0-0", "author": "Костя", "title": "Контроль хронического состояния", "tasks": [{"id": "9fe862d07d03", "text": "Упростить напоминалку на главном экране — визуально и когнитивно.", "tag": "ux"}, {"id": "5fad68c8934f", "text": "Добавить календарь на экран с расписанием.", "tag": "ux"}, {"id": "59e983abc8be", "text": "Разбить список анализов на конкретные даты или промежутки времени на экране расписания.", "tag": "ux"}, {"id": "b4c9ae4d6f1b", "text": "Выделить рекомендуемые к сдаче анализы.", "tag": "ux"}, {"id": "35bf228ea38a", "text": "Учесть время на запись и сдачу в лаборатории при отображении сроков.", "tag": "ux"}, {"id": "7ace6a33d416", "text": "Подсветить информацию о том, что произойдет, если пользователь не успеет сдать анализы в срок.", "tag": "ux"}, {"id": "f61f76f47b3c", "text": "Рассмотреть отображение конкретных дат вместо «через N дней».", "tag": "ux"}, {"id": "6bea7e15534c", "text": "Обсудить целевую аудиторию и ее потребности в точности дат.", "tag": "discuss"}, {"id": "e0f6991a5566", "text": "Добавить пояснение о гибкости сроков сдачи — например, «примерно до» или «плюс-минус» в виде приписки или отдельного элемента.", "tag": "ux"}, {"id": "2744ad254398", "text": "Рассмотреть использование знака «примерно» — ~ или формулировки «примерно до» для дат.", "tag": "ux"}, {"id": "ced0e6b1e5d9", "text": "Продумать, как успокоить пользователя в случае просрочки сдачи анализов.", "tag": "ux"}, {"id": "0fc815abfdc1", "text": "Изменить формулировку «Контроль просрочен» на менее тревожную, например «Сдать в ближайшее время».", "tag": "ux"}, {"id": "d44bd0f30793", "text": "Пересмотреть тексты и нейминги в блоке напоминаний.", "tag": "ux"}, {"id": "5681784fe95f", "text": "Разделить визуально кнопки и статусы в карточках анализов.", "tag": "ux"}, {"id": "27d80691bfcb", "text": "Перенести настройку периодичности сдачи анализов в карточку самого анализа.", "tag": "ux"}, {"id": "5766688288a1", "text": "Сделать настройку периодичности более интуитивной, возможно, внутри карточки конкретного анализа.", "tag": "ux"}, {"id": "df1b5fd59904", "text": "Добавить иконку редактирования — карандашик рядом с периодичностью сдачи в карточке анализа.", "tag": "ux"}, {"id": "2abea392f438", "text": "Рассмотреть общую настройку периодичности для всех анализов на странице расписания.", "tag": "ux"}, {"id": "f760f2d0df9d", "text": "Сделать разбивку списка анализов по месяцам на странице расписания.", "tag": "ux"}, {"id": "3d5defc44e27", "text": "Упростить карточки анализов.", "tag": "ux"}, {"id": "1b83c149d9a5", "text": "Пересмотреть отображение статуса «уже в корзине», чтобы он не выглядел как новая сущность, а как измененное состояние кнопки.", "tag": "ux"}, {"id": "bae4c24c0acb", "text": "Использовать стандартное состояние кнопки «В корзине» — например, серая кнопка с текстом «В корзине» или галочкой вместо отдельного бейджа.", "tag": "ux"}, {"id": "f1d675c0fa14", "text": "Пересмотреть формулировку статуса «уже в корзине».", "tag": "ux"}, {"id": "014832b57eb7", "text": "Оставлять кнопку «В корзину» даже для анализов со статусом «ожидаем результаты», чтобы пользователь мог пересдать.", "tag": "ux"}, {"id": "a31b45755a7a", "text": "Упорядочить стили текста в карточках анализов, сгруппировав мелкие и крупные тексты для лучшей читаемости.", "tag": "ux"}, {"id": "a978743aa652", "text": "Продумать дополнительные точки входа на страницу расписания сдачи анализов.", "tag": "ux"}, {"id": "eb3be11007eb", "text": "Обосновать необходимость отдельной страницы для расписания сдачи анализов.", "tag": "discuss"}, {"id": "b2cc822e50a7", "text": "Добавить явный Call to Action для добавления анализов в корзину на странице расписания.", "tag": "ux"}, {"id": "61fc0ab8affb", "text": "Добавить кнопку с целевым действием — например, «Добавить анализы в корзину» или «Перейти к сдаче» в верхний блок напоминаний.", "tag": "ux"}, {"id": "ec39b3f75819", "text": "Продумать текст для кнопки Call to Action в верхнем блоке напоминаний.", "tag": "ux"}, {"id": "f35d14552e3b", "text": "Рассмотреть возможность сделать карточку анализа кликабельной для перехода к деталям и настройкам.", "tag": "ux"}]}, {"id": "s20260526p1i20-1-0", "author": "Кариша", "title": "ЛК-клиник", "tasks": [{"id": "ad1ac3a6eb92", "text": "Улучшить визуальную привязку скидочной цены к конкретной специальности и объяснить ее значение.", "tag": "ux"}, {"id": "fc4dee2fac94", "text": "Проверить отображение длинных названий специализаций и больших цен в таблице.", "tag": "ux"}, {"id": "99f5093b70ef", "text": "Удалить колонку с отзывами и перенести информацию об отзывах к рейтингу, чтобы освободить место для специализации и цены.", "tag": "ux"}, {"id": "9535815466f4", "text": "Уточнить, как маркетологи и владельцы клиник используют функционал кликабельных отзывов.", "tag": "discuss"}, {"id": "f9d141dd7277", "text": "Использовать чекбоксы вместо чипсов для выбора амбулаторного приема и приема по ДМС.", "tag": "ux"}, {"id": "a6d2bce2b862", "text": "Уточнить возможность проведения пользовательских исследований для раздела ЛК-клиник.", "tag": "discuss"}, {"id": "6edf887b58ae", "text": "Рассмотреть использование навигации внутри формы для редактирования, а не для полного заполнения.", "tag": "ux"}, {"id": "e1f9621da1ee", "text": "Изучить возможность автоматического импорта данных о врачах с других платформ — продукторов или парсинга документов.", "tag": "dev"}, {"id": "c4c3f49d57c2", "text": "Оценить возможность использования нейронных сетей для извлечения данных из различных форматов фидов.", "tag": "dev"}, {"id": "2fc054b46116", "text": "Исследовать возможность интеграции с МИС других платформ для автоматического получения данных.", "tag": "dev"}, {"id": "084557614417", "text": "Уточнить с разработкой, должен ли быть один курс повышения квалификации обязательным.", "tag": "discuss"}, {"id": "54ff98fc8473", "text": "Уточнить текущий статус и функциональность МИС.", "tag": "discuss"}, {"id": "73beaa74c599", "text": "Повторно уточнить возможность проведения пользовательских исследований.", "tag": "discuss"}, {"id": "784356ff0385", "text": "Узнать о возможности парсинга/импорта данных с продукторов.", "tag": "discuss"}]}]}, {"id": "s20260521p2i21", "date": "2026-05-21", "dateLabel": "21 мая", "meta": "21 мая 2026 · Ревью ч.2 · чт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260521p2i21-0-0", "author": "Юля", "title": "Главная медкарта", "tasks": [{"id": "154e8024897d", "text": "Унифицировать иконки пользователя в шапке и внутри медкарты", "tag": "ux"}, {"id": "a25c1eed55c1", "text": "Рассмотреть возможность удаления дублирующейся сущности пользователя внутри медкарты", "tag": "ux"}, {"id": "72eb8c528cb2", "text": "Навести порядок в отображении переключения пользователей/аккаунтов для избежания путаницы", "tag": "ux"}, {"id": "716ba869786c", "text": "Перенести кнопку загрузки документов внутрь раздела документов", "tag": "ux"}, {"id": "9b27600b286e", "text": "Исследовать частоту использования функции загрузки документов", "tag": "discuss"}, {"id": "d524bb8e7249", "text": "Сделать более очевидной пользу от загрузки документов — например, рекомендации", "tag": "ux"}, {"id": "dfcca80f05b3", "text": "Добавить промо-элементы для функции загрузки документов, если она будет давать рекомендации", "tag": "ux"}, {"id": "6d61dd2186b8", "text": "Добавить кнопку загрузки документов рядом с пунктом меню 'Документы' — например, в виде плюсика", "tag": "ux"}, {"id": "7591a2f748c8", "text": "Пересмотреть нейминг раздела 'Документы' на более конкретный — например, 'Результаты', 'Медданные'", "tag": "ux"}, {"id": "cf6af7b22ffe", "text": "Унифицировать стили фильтров — чипсы/табы на всех страницах", "tag": "ux"}, {"id": "c73ab66ccc5a", "text": "Добавить ФИО врача на карточки приемов", "tag": "ux"}, {"id": "4eb66d048f8d", "text": "Проверить актуальность пунктов в шапке меню — например, 'диагностика', 'тонометр'", "tag": "ux"}, {"id": "8559a128375e", "text": "Унифицировать формулировки для подготовки к приему/анализам — например, 'Подготовьтесь к приему', 'Требуется подготовка'", "tag": "ux"}, {"id": "2267c93262d6", "text": "Продумать отображение кнопки 'Требуется подготовка' для случаев, когда она неактивна или не нужна", "tag": "ux"}, {"id": "62ca796caecf", "text": "Пересмотреть иерархию информации на карточках приемов, возможно, акцентировать дату и время", "tag": "ux"}, {"id": "89e7018a76b1", "text": "Пересмотреть отображение блоков 'Предстоящие' и 'Прошедшие', чтобы 'Предстоящие' занимали больше места и были более заметны", "tag": "ux"}, {"id": "023a541c9a3e", "text": "Унифицировать отступы и интервалы между элементами на всех страницах", "tag": "ux"}, {"id": "1957a81c3224", "text": "Убрать дублирование профиля пользователя", "tag": "ux"}, {"id": "ff1896570fce", "text": "Пересмотреть ширину сайдбара, чтобы центральная часть была более акцентной", "tag": "ux"}, {"id": "741a3af6c14e", "text": "Сделать более понятным индикатор 'один из трех результатов' и его расположение", "tag": "ux"}, {"id": "d1245ae4af04", "text": "Обсудить функционал и детали фичи 'Загрузить документ' отдельно", "tag": "discuss"}, {"id": "919cfb9e7450", "text": "Пересмотреть логику ранжирования предстоящих записей и анализов, чтобы сначала показывались ближайшие по дате", "tag": "ux"}, {"id": "12d0f3ac622c", "text": "Унифицировать формат отображения даты и времени на карточках", "tag": "ux"}, {"id": "1806c4224cb8", "text": "Определиться с единым форматом даты, включая год, для всех карточек", "tag": "ux"}, {"id": "158ab64a223c", "text": "Провести исследования с пользователями по концепту медкарты", "tag": "discuss"}, {"id": "547159e3fe06", "text": "Исследовать понятность категорий фильтрации — 'онлайн', 'в клинике', 'анализы' для пользователей", "tag": "discuss"}, {"id": "d3dd34f3c8eb", "text": "Рассмотреть возможность разделения записей по статусу — предстоящие/прошедшие с помощью табов", "tag": "ux"}, {"id": "d16a1a0cd609", "text": "Добавить быстрые фильтры по дате — например, 'на ближайшую неделю' и поиск для старых записей", "tag": "ux"}, {"id": "289d82fe7d43", "text": "Добавить функцию поиска по записям и документам", "tag": "ux"}, {"id": "cd3e5c6fd3fe", "text": "Обеспечить удобство поиска и навигации по загруженным документам", "tag": "ux"}, {"id": "7220e46a0623", "text": "Пересмотреть концепцию мобильного меню, найти новое решение, не дублирующее существующие элементы и обеспечивающее видимость важных разделов", "tag": "ux"}, {"id": "db624f79ec05", "text": "Увеличить размеры шрифтов, кнопок и блоков для улучшения читаемости и удобства взаимодействия на мобильной версии", "tag": "ux"}, {"id": "bb4502bb1025", "text": "Пересмотреть использование градиентов для скидок, унифицировать их стиль и обеспечить читаемость на разных фонах", "tag": "ux"}, {"id": "108ee3775f47", "text": "Уточнить логику и отображение статуса 'Активные' для назначений врачей", "tag": "ux"}, {"id": "95102d8b8dab", "text": "Обсудить целесообразность разделения планов лечения на 'Активные' и 'Завершенные' и возможность отказа от 'Завершенных'", "tag": "discuss"}, {"id": "ba4d21613503", "text": "Пересмотреть приоритизацию блоков 'Назначения' и 'Предстоящие', возможно, 'Предстоящие' должны быть выше", "tag": "ux"}, {"id": "d02b77fb5063", "text": "Учесть сценарии активных пользователей с большим количеством записей при проектировании медкарты", "tag": "ux"}, {"id": "a9390f9e77e9", "text": "Реализовать механизм скрытия или сворачивания неактуальных или уже просмотренных направлений на повторные записи", "tag": "ux"}, {"id": "21a31aa38cb7", "text": "Сделать блок 'Назначения' менее навязчивым после первого просмотра или принятия решения", "tag": "ux"}]}, {"id": "s20260521p2i21-1-0", "author": "Надя", "title": "Лендинг по чистке зубов", "tasks": [{"id": "2f4ae338ace0", "text": "Уточнить функциональные требования и логику работы сервиса по подбору чистки зубов", "tag": "discuss"}]}]}, {"id": "s20260514p2i22", "date": "2026-05-14", "dateLabel": "14 мая", "meta": "14 мая 2026 · Ревью ч.2 · чт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260514p2i22-0-0", "author": "Надя", "title": "Банкоматы", "tasks": [{"id": "ffaca616d7fa", "text": "Попробовать синие акцентные кнопки вместо серых.", "tag": "ux"}, {"id": "5400d6a92a34", "text": "Утвердить возможность добавления промокода с юристами.", "tag": "discuss"}, {"id": "fd3feb085b3a", "text": "Дотюнить карточки.", "tag": "ux"}, {"id": "ad0cc2fe190d", "text": "Уточнить, насколько текущая логика с кликабельными элементами соответствует возможности сдачи анализов.", "tag": "discuss"}, {"id": "b2d1b89c2cac", "text": "Попробовать более маркетинговое отображение блока.", "tag": "ux"}, {"id": "9b56350dd29b", "text": "Рассмотреть использование стрелок вместо кнопок и прикрутить текстовую информацию — например, цену под заголовок.", "tag": "ux"}, {"id": "840031ff10e8", "text": "Использовать вариант с корешочком и двумя кнопками.", "tag": "ux"}, {"id": "4cb811b9b193", "text": "Добавить маленькую ссылку/кнопку «Подробнее» для проваливания и чтения информации.", "tag": "ux"}, {"id": "58d4cfafe16f", "text": "Попробовать использовать иллюстрации вместо иконок.", "tag": "ux"}, {"id": "4e5051d8d966", "text": "Протестировать маркетинговые варианты отображения, если интерфейсные не работают.", "tag": "ux"}]}, {"id": "s20260514p2i22-1-0", "author": "Костя", "title": "Хроники", "tasks": [{"id": "7a793d2ba806", "text": "Сократить количество текста на экране, облегчить восприятие.", "tag": "ux"}, {"id": "3f649c05896f", "text": "Поменять местами блоки информации о том, как будет выглядеть/работать мониторинг и список анализов.", "tag": "ux"}, {"id": "358e39dc5f23", "text": "Уточнить, почему авторизация выглядит непривычно.", "tag": "discuss"}, {"id": "3dcd9fcca7c8", "text": "Проверить цвет нижней синей ссылки в авторизации, чтобы она соответствовала остальным.", "tag": "ux"}, {"id": "9cfcbf5935bf", "text": "Уточнить текущую стратегию по Сбер ID авторизации и отображению других способов.", "tag": "discuss"}, {"id": "c73ac193996e", "text": "Изучить референсы Paywall и трекеров для отображения превью мониторинга.", "tag": "ux"}, {"id": "4e6a16440a0f", "text": "Заменить текстовые объяснения на графики и визуальные элементы.", "tag": "ux"}, {"id": "bba1010a7253", "text": "Уточнить у ответственного текущие возможности отображения динамики анализов в Мид-карте.", "tag": "discuss"}, {"id": "eb080dd14c87", "text": "Уточнить, как будет точно отображаться динамика анализов, учитывая возможные ограничения по подтягиванию данных.", "tag": "discuss"}, {"id": "da4c83b8b55e", "text": "Визуально объединить блоки про мониторинг, расшифровку анализов и рекомендации.", "tag": "ux"}, {"id": "c533f8cccf8c", "text": "Визуально разделить или переформулировать два типа рекомендаций по анализам — базовые и дополнительные, чтобы избежать путаницы.", "tag": "ux"}, {"id": "4424e9bb49c9", "text": "Добавить заголовки для разделения базовых и дополнительных анализов — например, 'Базовые анализы для контроля', 'Рекомендуемые анализы'.", "tag": "ux"}, {"id": "7fea8ed2f9ed", "text": "Уточнить нейминг для базовых и дополнительных анализов — например, 'базовая панель контроля'.", "tag": "discuss"}, {"id": "8086a98c8354", "text": "Рассмотреть использование чекбоксов вместо кнопок 'Добавить' для рекомендуемых анализов.", "tag": "ux"}, {"id": "a9f1445ae366", "text": "Изменить кнопки добавления в корзину на чекбоксы для ясности действия.", "tag": "ux"}, {"id": "008c2370bf4a", "text": "Упростить визуальное оформление блока с анализами, сделать его менее 'шумным', возможно, использовать подход с единым блоком-плашкой.", "tag": "ux"}, {"id": "f11b6a5d1e73", "text": "Рассмотреть использование плашек для отображения пакетов анализов, как в проекте с беременными.", "tag": "ux"}, {"id": "8f55eee9ff30", "text": "Сделать MVP-версию максимально простой и чистой, без лишней информации.", "tag": "ux"}, {"id": "e57f3377f886", "text": "Сократить список анализов, часть убрать под 'показать еще'.", "tag": "ux"}, {"id": "f0d52d92dc03", "text": "Убрать стрелки из списка анализов.", "tag": "ux"}, {"id": "2703158898d3", "text": "Сделать одну точку входа для выбора анализов и отображать только финальную общую цену.", "tag": "ux"}, {"id": "df47698b5a45", "text": "Показать общую выгоду от пакета анализов, сравнивая обычную цену и цену со скидкой, без детализации по каждому анализу.", "tag": "ux"}, {"id": "f5c7075f2479", "text": "Убрать процент скидки и зачеркнутую цену для каждого анализа, чтобы уменьшить визуальный шум.", "tag": "ux"}, {"id": "4acd36fe1eec", "text": "Отображать одну общую цену вместо цен для каждого анализа.", "tag": "ux"}, {"id": "12e569e16aae", "text": "Реализовать динамическое изменение общей цены в зависимости от выбранных чекбоксов.", "tag": "dev"}, {"id": "cb1021954bca", "text": "Не показывать цену для каждого анализа, если она не финальная и зависит от выбора лаборатории.", "tag": "ux"}, {"id": "d8108e2a6a4e", "text": "Добавить блок с информацией о промокодах и их применении для демонстрации выгоды.", "tag": "ux"}, {"id": "fe88e1958425", "text": "Реализовать автоматическое применение промокода и отображение этого в промо-блоке.", "tag": "dev"}, {"id": "365a160d6b3d", "text": "Создать отдельный блок с перечислением всех выгод — СберСпасибо, промокоды, Тинек.", "tag": "ux"}, {"id": "3a4bf581fe01", "text": "Уточнить, что подразумевается под 'рекомендациями' и не является ли это бесплатным приемом к врачу.", "tag": "discuss"}, {"id": "18b3611f0afe", "text": "Объединить блоки 'Расшифровка результатов' и 'Рекомендации'.", "tag": "ux"}, {"id": "5799cf2ec56d", "text": "Подсветить информацию о бесплатном приеме врача, если он включен в пакет.", "tag": "ux"}, {"id": "b8809abdbf8a", "text": "Найти готовые баннеры для консультации врача по результатам анализов.", "tag": "ux"}, {"id": "e0e390c1be28", "text": "Упаковать предложение в комбо-пакет, четко обозначив, что входит — прием врача, анализы, расшифровка.", "tag": "ux"}, {"id": "1d7a6e96f6a6", "text": "Максимально упростить тексты и визуалы для MVP-версии.", "tag": "ux"}, {"id": "a0503511f869", "text": "Отказаться от разработки десктопной версии на текущем этапе.", "tag": "dev"}]}]}, {"id": "s20260512p1i23", "date": "2026-05-12", "dateLabel": "12 мая", "meta": "12 мая 2026 · Ревью ч.1 · вт", "designersCount": 2, "fun": {}, "projects": [{"id": "s20260512p1i23-1-0", "author": "Аня", "title": "Баннер с пакетами услуг", "tasks": [{"id": "876bf4336693", "text": "Не накладывать бейдж на иллюстрацию — зайца, так как это ломает композицию баннера.", "tag": "ux"}, {"id": "5cae2a0fc5d4", "text": "Использовать обычный бейдж вместо «минус 100%».", "tag": "ux"}, {"id": "241cbe3d03ac", "text": "Избегать размещения бейджа над иллюстрацией, чтобы не ломать верстку.", "tag": "ux"}, {"id": "e7e43d26b598", "text": "Пересмотреть текст «бесплатно» в бейдже, так как он слишком длинный и выходит за границы.", "tag": "ux"}, {"id": "a741eb72edf4", "text": "Рассмотреть вариант «0 рублей» вместо «бесплатно» или «минус 100%».", "tag": "ux"}, {"id": "2044f3e68b6c", "text": "Завершить работу над баннером, не тратить много времени на мелкие правки.", "tag": "discuss"}]}, {"id": "s20260512p1i23-1-1", "author": "Аня", "title": "Лендинг «Комплексная проверка женского здоровья»", "tasks": [{"id": "d4334ed7486d", "text": "Уточнить флоу открытия модалки со списком клиник или страницы «Комплексная проверка женского здоровья».", "tag": "ux"}, {"id": "76f814cac439", "text": "Исправить макеты, чтобы отображалась только модалка, без отдельных экранов.", "tag": "ux"}, {"id": "5209e3b25128", "text": "Обсудить целесообразность переделки карточки клиники в рамках этой задачи, учитывая риски и сложность измерения конверсии.", "tag": "discuss"}, {"id": "b16ce6f7513c", "text": "Проверить качество фотографий клиник для использования в карточках, так как текущие могут быть низкого качества.", "tag": "ux"}, {"id": "c9553f3f64c3", "text": "Не переделывать карточки клиник в рамках текущей задачи, сосредоточиться на лендинге.", "tag": "ux"}, {"id": "9f08fce4e444", "text": "Прорисовать флоу взаимодействия с модалкой, особенно при открытии карты или закрытии.", "tag": "ux"}, {"id": "469ef73f34ca", "text": "Не реализовывать карту внутри модалки.", "tag": "ux"}, {"id": "e383b8689132", "text": "Уточнить, что открывается при клике на фотографию клиники в модалке.", "tag": "ux"}, {"id": "95a90e88591d", "text": "Отказаться от модалки и просто открывать текущую выдачу клиник.", "tag": "ux"}, {"id": "46a030f4d70a", "text": "Сфокусироваться на лендинге и не менять флоу выдачи клиник.", "tag": "ux"}, {"id": "15c1ef6ac7ea", "text": "При клике «Выбрать клинику» вести пользователя к списку клиник на текущей странице — якорь.", "tag": "ux"}, {"id": "38ca17632adc", "text": "Сократить количество текста в первом блоке лендинга.", "tag": "ux"}, {"id": "f0905a2db532", "text": "Убрать информацию о «50 клиниках Москвы» из первого блока.", "tag": "ux"}, {"id": "13f55ba65bae", "text": "Подобрать реалистичные иллюстрации для блоков, как на главной странице анализов.", "tag": "ux"}, {"id": "9ab4fec9a4ec", "text": "Переделать лендинг, чтобы повысить конверсию и сделать информацию о наполнении обследования более понятной, сократить повторяющийся текст.", "tag": "ux"}, {"id": "41ec53354dbe", "text": "Пересмотреть визуальное оформление блока «Что входит в комплекс», чтобы он не выглядел суховато.", "tag": "ux"}, {"id": "a4fbe8fb5d30", "text": "При подборе иллюстраций для онлайн-консультации сделать акцент на враче за компьютером.", "tag": "ux"}, {"id": "564eb63b24fd", "text": "Убрать блок с просьбой сообщить о желании пройти все за один день, так как это может запутать пользователя и дублирует функционал КЦ.", "tag": "ux"}, {"id": "13beaf0dbda1", "text": "Сократить текст в первом блоке до минимума.", "tag": "ux"}, {"id": "a8491f916df1", "text": "Пересмотреть Tone of Voice текста, сделать его менее тревожным и более поддерживающим.", "tag": "ux"}, {"id": "221e3f543f6a", "text": "Перенести SEO-тексты из шапки в отдельные блоки в конце страницы или внутри описаний.", "tag": "ux"}, {"id": "59c847dd3269", "text": "Сделать блоки «Анализы», «Обследования» и «Приемы у врачей» равнозначными по визуальному весу.", "tag": "ux"}, {"id": "2ca127b7a91a", "text": "Пересмотреть стиль фотографий в блоке «Что входит в комплекс», чтобы они выглядели как нативные элементы, а не как статьи.", "tag": "ux"}, {"id": "8f53a06a56a4", "text": "Изучить макеты Глеба по первому концерту для референса по отображению врачей и обследований.", "tag": "ux"}, {"id": "7560fb472d27", "text": "Продумать дизайн как конструктор для масштабирования на множество комплексов с разным наполнением.", "tag": "ux"}, {"id": "8dd3726cb61e", "text": "Создавать отдельные файлы или страницы для каждой новой задачи, не использовать старый файл «сегмент беременных» для несвязанных проектов.", "tag": "discuss"}, {"id": "56ee072fc158", "text": "Восстановить логику блоков: заголовок должен входить внутрь блока, а не быть отдельным элементом.", "tag": "ux"}, {"id": "c759d18d812b", "text": "Пересмотреть цветовую палитру блока «Этапы и подготовка», избегать глухих голубых заливок, которые затрудняют чтение текста.", "tag": "ux"}, {"id": "130debc9cb26", "text": "Скорректировать блок «Итог», чтобы он логически вписывался в последовательность этапов и не выглядел оторванным.", "tag": "ux"}, {"id": "ebebf91d86d7", "text": "Убедиться, что развернутый текст в блоке «Этапы и подготовка» хорошо читается на выбранном фоне.", "tag": "ux"}, {"id": "559c1c05a6e4", "text": "Уточнить логику и временные рамки прохождения комплекса — например, что означают «12 месяцев».", "tag": "ux"}, {"id": "0e72113130c1", "text": "Определить целевую аудиторию и возрастные сегменты для комплекса, чтобы обеспечить индивидуализацию.", "tag": "ux"}, {"id": "819625423e84", "text": "Добавить на лендинг блоки с онбордингом, объясняющие, что такое комплекс, как он собран, как им пользоваться, и для кого он предназначен.", "tag": "ux"}, {"id": "790267c75fb1", "text": "Изучить SEO-запросы и таргетирование, чтобы адаптировать контент лендинга под конкретные запросы пользователей.", "tag": "discuss"}, {"id": "baf52286b768", "text": "Рассмотреть создание нескольких таргетированных лендингов под разные возрастные сегменты и запросы.", "tag": "ux"}, {"id": "a8376946bc79", "text": "Уточнить, как пользователь может выбрать обследования по возрасту и можно ли исключить ненужные услуги из комплекса.", "tag": "ux"}, {"id": "a90679dd90d9", "text": "Рассмотреть вариант с выбором возраста — например, через чипсы для персонализации списка обследований.", "tag": "ux"}, {"id": "be5140c448fc", "text": "Использовать стилистику и структуру второй версии лендинга Константина для беременных.", "tag": "ux"}, {"id": "58d6a96a13cc", "text": "Изучить вариант Константина с разбивкой по триместрам и применить его для создания отдельных списков обследований для каждого возраста.", "tag": "ux"}, {"id": "9d793bbb9d18", "text": "Сузить сегмент возраста для комплекса — например, только до 40 лет или только после 40 лет.", "tag": "ux"}, {"id": "592bb83982eb", "text": "Обеспечить одинаковый вординг и стиль текста в списках обследований.", "tag": "ux"}, {"id": "dd83ffbc37f3", "text": "Скорректировать сетку и выравнивание элементов в блоках, чтобы избежать «лесенки» в тексте и обеспечить правильные размеры фоток.", "tag": "ux"}]}, {"id": "s20260512p1i23-2-0", "author": "Костя", "title": "Опросник аллергиков", "tasks": [{"id": "0a5323392b0f", "text": "Учесть, что задача по опроснику аллергиков должна быть реализована максимально просто и дешево.", "tag": "dev"}, {"id": "60911f1d5b79", "text": "Пересмотреть использование иконок в опроснике, так как они могут спорить с чекбоксами.", "tag": "ux"}, {"id": "ea070532c5ff", "text": "Убрать иконки из опросника.", "tag": "ux"}, {"id": "99a61394c8f0", "text": "Проверить пунктуацию в заголовке «Отмечайте пункты, в которых встречаются похожие реакции, симптомы».", "tag": "ux"}, {"id": "1c528525c294", "text": "Убедиться в правильности пунктуации в заголовке, запятая нужна.", "tag": "ux"}]}]}, {"id": "s20260507p2i24", "date": "2026-05-07", "dateLabel": "7 мая", "meta": "7 мая 2026 · Ревью ч.2 · чт", "designersCount": 4, "fun": {}, "projects": [{"id": "s20260507p2i24-0-0", "author": "Ксюша", "title": "Авторизация и личный кабинет", "tasks": [{"id": "8cc6a17c71ad", "text": "Добавить визуальный элемент на экран авторизации.", "tag": "ux"}, {"id": "1bbf14415b06", "text": "Определить понятное для пользователей название проекта 'Партнерская программа для врачей'.", "tag": "ux"}, {"id": "32f2bc8f5d71", "text": "Изменить текст ссылки 'На главную' на 'К партнерской программе'.", "tag": "ux"}, {"id": "27ce4dfb541a", "text": "Убрать крестик с экрана авторизации, если это не модальное окно.", "tag": "ux"}, {"id": "605318a288c3", "text": "Переместить ссылку 'К партнерской программе' в верхний левый угол, вне блока с кодом.", "tag": "ux"}, {"id": "104fccba9503", "text": "Рассмотреть классическую навигацию с логотипом и меню.", "tag": "ux"}, {"id": "752b79a54a4b", "text": "Изменить текст ссылки 'К партнерской программе' на 'О программе'.", "tag": "ux"}, {"id": "c06c23835828", "text": "Уточнить, открывается ли авторизация в новом окне.", "tag": "discuss"}, {"id": "5e2c075ff2f6", "text": "Добавить юридические тексты и соглашения в футер.", "tag": "ux"}, {"id": "6c5887d8251c", "text": "Уточнить содержание футера с юридическим отделом.", "tag": "discuss"}, {"id": "5a2e1a8536c3", "text": "Добавить нижнюю границу прямоугольника, чтобы обозначить конец контента и избежать ощущения скролла.", "tag": "ux"}, {"id": "79a4c940e3c8", "text": "Пересмотреть иллюстрации для состояний ошибок.", "tag": "ux"}, {"id": "950876bd8768", "text": "Удалить существующие иллюстрации ошибок.", "tag": "ux"}, {"id": "210243bd7082", "text": "Изменить отображение ошибки с модального окна на полноэкранную страницу.", "tag": "ux"}, {"id": "8c259a71fefa", "text": "Обсудить обработку ошибок с командой фронтенда.", "tag": "dev"}, {"id": "693b9d2ab425", "text": "Убедиться, что кнопка 'Повторить' только повторно отправляет запрос.", "tag": "ux"}, {"id": "02816b73826f", "text": "Разработать тексты для различных типов ошибок и определить их поведение.", "tag": "ux"}, {"id": "015d25097e33", "text": "Рассмотреть использование тостов для определенных типов ошибок.", "tag": "ux"}, {"id": "3735da62df57", "text": "Использовать отдельную страницу для ошибок на стороне сервиса.", "tag": "ux"}, {"id": "387b425af5ea", "text": "Просмотреть комментарии и исправления на лендинге.", "tag": "ux"}]}, {"id": "s20260507p2i24-1-0", "author": "Надя", "title": "Карточки врачей / Акция 'Бесплатный прием'", "tasks": [{"id": "e50d17d70df5", "text": "Избегать дублирования 'бесплатно' и '0 рублей' в одной строке.", "tag": "ux"}, {"id": "d7101b6c8b62", "text": "Пересмотреть размещение бейджа 'бесплатно'.", "tag": "ux"}, {"id": "6e63b287c27a", "text": "Избегать 3D-элементов, которые создают ощущение смещения текста.", "tag": "ux"}, {"id": "e9867fa7aea9", "text": "Перефразировать 'бесплатно', чтобы избежать повторений и уточнить платные услуги.", "tag": "ux"}, {"id": "55c46d86d64c", "text": "Сохранить формулировку 'бесплатно' вместо '0 рублей'.", "tag": "ux"}, {"id": "2721d9c8590c", "text": "Перефразировать '0 рублей за осмотр' на 'бесплатно осмотр и консультации' — если помещается.", "tag": "ux"}, {"id": "5b74a2093bde", "text": "Перефразировать 'бесплатно 0 рублей' на 'бесплатно за первый осмотр'.", "tag": "ux"}, {"id": "9f0c941ae665", "text": "Избегать создания новых стилей бейджей.", "tag": "ux"}, {"id": "2844812a7c23", "text": "Рассмотреть отображение 'бесплатно' рядом с зачеркнутой средней ценой.", "tag": "ux"}, {"id": "20c2a33ff4c6", "text": "Сократить текст на диагональных лейблах.", "tag": "ux"}, {"id": "e73411709cf2", "text": "Обсудить необходимость дополнительного акцента на слове 'бесплатно'.", "tag": "discuss"}, {"id": "965a7b6b7ba8", "text": "Рассмотреть вынесение опции 'бесплатно' в фильтры вместо использования бейджей.", "tag": "ux"}, {"id": "43474fad664d", "text": "Рассмотреть использование баннеров/заголовков страницы для продвижения 'бесплатно' на страницах с UTM-метками.", "tag": "ux"}, {"id": "d6369ce18607", "text": "Избегать изменения отдельных карточек, если все врачи на странице бесплатны.", "tag": "ux"}, {"id": "68fde92cd2db", "text": "Попробовать аккуратный вариант с текстом 'осмотр, консультация' и акцентный вариант — не под углом, сбоку без '0 рублей'.", "tag": "ux"}]}, {"id": "s20260507p2i24-2-0", "author": "Костя", "title": "Опросник по аллергиям", "tasks": [{"id": "6f8ec5041f2d", "text": "Уточнить у Никиты, можно ли разделить симптомы на отдельные пункты.", "tag": "discuss"}, {"id": "9867f9592f54", "text": "Уточнить дублирующиеся симптомы — 3-й и 4-й пункты.", "tag": "discuss"}, {"id": "06385cd15ecb", "text": "Использовать существующее веб-решение — пошаговый опросник вместо имитации чата.", "tag": "ux"}, {"id": "cac5f23639c6", "text": "Доработать текст: убрать скобки, сократить формулировки, увеличить отступы.", "tag": "ux"}, {"id": "05256c4c95e0", "text": "Уменьшить объем текста для улучшения визуальной ясности.", "tag": "ux"}, {"id": "456215727261", "text": "Добавить небольшую иконографику для различения категорий симптомов.", "tag": "ux"}, {"id": "7c5aa581801f", "text": "Уточнить со Сбером, можно ли использовать маскота 'Куся'.", "tag": "discuss"}, {"id": "91d127c052f1", "text": "Использовать маскота 'Куся' для консистентности, быть готовым к изменениям.", "tag": "ux"}]}, {"id": "s20260507p2i24-3-0", "author": "Глеб", "title": "Страница неактивного врача", "tasks": [{"id": "8f9e1765986a", "text": "Определиться с цветом блока 'врач не принимает' — темно-серый для десктопа, синий для мобильной версии.", "tag": "ux"}, {"id": "7d2b23559091", "text": "Пересмотреть использование плашки/бейджа для сообщения 'врач не принимает'.", "tag": "ux"}, {"id": "9314b136fd6d", "text": "Использовать четкий заголовок 'Врач не принимает' с пояснительным текстом.", "tag": "ux"}, {"id": "2d21e5c34687", "text": "Уменьшить визуальный шум и обеспечить единообразие поведения иконок 'Ишка'.", "tag": "ux"}, {"id": "313513f734d0", "text": "Не направлять пользователей в колл-центр.", "tag": "discuss"}, {"id": "d77afc768aea", "text": "Пересмотреть явное упоминание 'ИИ' в формулировке 'подобрать врача через ИИ'.", "tag": "ux"}, {"id": "51099ca49ddf", "text": "Перефразировать 'Выбрать другого врача с ИИ' на более понятную формулировку — например, 'ИИ-помощник'.", "tag": "ux"}, {"id": "d4dbb7db44a4", "text": "Уточнить флоу после нажатия кнопки 'Выбрать другого врача с ИИ'.", "tag": "ux"}, {"id": "e880dc408e84", "text": "Изменить текст кнопки на 'Выбрать другого врача' без упоминания 'ИИ'.", "tag": "ux"}, {"id": "f16136d3c764", "text": "Использовать серый цвет для нейтральной информации — например, 'врач не принимает' вместо светло-голубого.", "tag": "ux"}, {"id": "e956dd92bbcf", "text": "Обеспечить единообразие цвета иконки 'Ишка' на разных платформах.", "tag": "ux"}, {"id": "729dfd1ef3e5", "text": "Найти и поделиться примерами похожих пустых состояний с двумя кнопками.", "tag": "discuss"}, {"id": "c644408e8713", "text": "Рассмотреть использование серой плашки.", "tag": "ux"}, {"id": "cc80b7c04cb7", "text": "Поделиться примерами карточек клиник с плашкой 'оставить отзыв'.", "tag": "discuss"}, {"id": "378d50321a94", "text": "Оставить 'Оставить отзыв' в виде кнопки.", "tag": "ux"}]}]}, {"id": "s20260505p1i25", "date": "2026-05-05", "dateLabel": "5 мая", "meta": "5 мая 2026 · Ревью ч.1 · вт", "designersCount": 3, "fun": {}, "projects": [{"id": "s20260505p1i25-0-0", "author": "Ксюша", "title": "Лендинг и личный кабинет", "tasks": [{"id": "5f3d2e187000", "text": "Узнать у системного аналитика Стаса, можно ли сделать авторизацию EMI отдельной страницей.", "tag": "discuss"}, {"id": "8b8dde5f4df9", "text": "Добавить приписку к названию проекта на странице авторизации.", "tag": "ux"}, {"id": "6d3f8c1711c8", "text": "Выбрать вариант с лендингом или авторизацией, исходя из простоты разработки.", "tag": "discuss"}, {"id": "c126080c60c0", "text": "Продумать кейсы выхода из личного кабинета.", "tag": "discuss"}, {"id": "d80887222bac", "text": "Пересмотреть верстку розового блока.", "tag": "ux"}, {"id": "9eacc45ed507", "text": "Скорректировать отступы и выравнивание в розовом блоке.", "tag": "ux"}, {"id": "ea6574911828", "text": "Выровнять заголовки по одному уровню.", "tag": "ux"}, {"id": "64a18e6cfb91", "text": "Пересмотреть цветовую палитру, обеспечить гармонию теплых и холодных оттенков.", "tag": "ux"}, {"id": "d6fa40ab71fb", "text": "Убрать фиолетовый цвет из градиента, использовать белый.", "tag": "ux"}, {"id": "9adc453367e6", "text": "Пересмотреть иллюстрацию сверху.", "tag": "ux"}, {"id": "b87ed114189e", "text": "Унифицировать скругления и стили кнопок «Войти» и «Стать партнером».", "tag": "ux"}]}, {"id": "s20260505p1i25-1-0", "author": "Глеб", "title": "Навигация и корзина в услугах", "tasks": [{"id": "752591146442", "text": "Заменить иконку корзины везде, сделать ее контурной и соответствующей стилю.", "tag": "ux"}, {"id": "d102ae57603d", "text": "Отложить разработку десктопной версии корзины.", "tag": "dev"}, {"id": "f4191fa82b65", "text": "Не менять текущую кнопку корзины справа — для эксперимента.", "tag": "dev"}, {"id": "dfef07d4402f", "text": "Продумать компактный вид кнопки корзины — после эксперимента.", "tag": "ux"}, {"id": "ff47ad2852fd", "text": "Обсудить размещение корзины в табаре вместо медкарты — после эксперимента.", "tag": "discuss"}, {"id": "793c4ce4ccda", "text": "Затягивать навигацию на услуги, не связывая с корзиной пока.", "tag": "dev"}, {"id": "36f98e29d302", "text": "Уточнить у Темы статус навигации и корзины — эксперимент или глобальная задача.", "tag": "discuss"}, {"id": "869eb99f8292", "text": "Пересмотреть кнопку корзины — с «ухом» после эксперимента.", "tag": "ux"}]}, {"id": "s20260505p1i25-2-0", "author": "Аня", "title": "Иконки в навигации", "tasks": [{"id": "3166bd64dbfe", "text": "Подобрать другую иконку для «Уже сдавали», чтобы она не была похожа на «обновление» и не выглядела «коряво».", "tag": "ux"}, {"id": "37eb6fa2636f", "text": "Унифицировать толщину линий иконок — например, медкарта и корзина.", "tag": "ux"}, {"id": "05f11462f27c", "text": "Изменить иконку «Результаты», чтобы она не дублировала иконку «Медкарта».", "tag": "ux"}, {"id": "b9d00290c97e", "text": "Если «Медкарта» и «Результаты» — одна сущность, оставить одну кнопку.", "tag": "ux"}, {"id": "dd90e1fcbf17", "text": "Убрать иконку геолокации рядом с «Москва».", "tag": "ux"}, {"id": "3b780ffe113b", "text": "Унифицировать цвет кликабельных иконок — звонок синий, остальные нет.", "tag": "ux"}, {"id": "72707d3d58f0", "text": "Упростить иконки, уменьшить их количество/разнообразие.", "tag": "ux"}, {"id": "8b6b5e8ce812", "text": "Унифицирова function esc(s){ return (''+s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function plural(n,a,b,c){ const m=n%100, d=n%10; if(m>=11&&m<=14) return c; if(d===1) return a; if(d>=2&&d<=4) return b; return c; }

const projById = {};
DATA.sessions.forEach(s=> s.projects.forEach(p=>{ projById[p.id]=p; }));
const DIDX = {};
DATA.sessions.forEach(s=> s.projects.forEach(p=>{ (DIDX[p.author]=DIDX[p.author]||[]).push({ dateLabel:s.dateLabel, sid:s.id, project:p }); }));
function meetingsOf(n){ const seen={}; DIDX[n].forEach(e=>{ seen[e.sid]=1; }); return Object.keys(seen).length; }
// сортируем по активности: кто чаще приходил — выше; разово заходившие опускаются вниз
const designerNames = Object.keys(DIDX).sort((a,b)=>{ const d=meetingsOf(b)-meetingsOf(a); return d!==0 ? d : a.localeCompare(b,'ru'); });
const maxMeetings = designerNames.length ? Math.max(...designerNames.map(meetingsOf)) : 0;
// корона тем, кто ходил больше всех (если у лидера хотя бы 2 встречи)
function isTop(n){ return maxMeetings>=2 && meetingsOf(n)===maxMeetings; }
// шуточный статус, виден при открытии дизайнера
function designerStatus(n){
  if(!isTop(n)) return null;
  const q=(DATA.genders||{})[n]==='f';
  return {t:(q?'Королева':'Король')+' ревью — приходит чаще всех', c:'st-king'};
}

let mode='designers', sIdx=0, dIdx=0;
const elNav=document.getElementById('nav-list');
const elMain=document.getElementById('main');

function countDone(tasks){ let n=0; tasks.forEach(t=>{ if(state[t.id]) n++; }); return n; }
function taskHTML(t,projId){
  const lbl=tagLabel[t.tag];
  const tg = lbl ? `<span class="tag ${t.tag}">${lbl}</span>` : '';
  return `<div class="task ${state[t.id]?'checked':''}" id="task-${t.id}" onclick="toggleTask('${t.id}','${projId}')">
    <div class="checkbox"></div>
    <div class="task-text">${esc(t.text)}${tg}</div></div>`;
}
function cardHTML(p,headline){
  const done=countDone(p.tasks), total=p.tasks.length;
  return `<div class="project" id="proj-${p.id}">
    <div class="project-header" onclick="toggleProj('${p.id}')">
      <div><div class="author">${esc(headline)}</div><div class="project-name">${esc(p.title)}</div></div>
      <div class="project-right"><div class="count ${done===total&&total>0?'done':''}" id="count-${p.id}">${done}/${total}</div><div class="chevron">▾</div></div>
    </div>
    <div class="tasks">${p.tasks.map(t=>taskHTML(t,p.id)).join('')}</div></div>`;
}
function emptyHTML(){ return '<div class="placeholder">Пока нет ни одного ревью.<br>Как только придёт первый конспект — он появится здесь.</div>'; }

function renderNav(){
  if(mode==='meetings'){
    if(!DATA.sessions.length){ elNav.innerHTML='<div class="nav-empty">Нет встреч</div>'; return; }
    elNav.innerHTML = DATA.sessions.map((s,i)=>`<div class="nav-item ${i===sIdx?'active':''}" onclick="selectSession(${i})">
      <div class="nav-main">${esc(s.dateLabel)}</div>
      <div class="nav-sub">${s.designersCount} ${plural(s.designersCount,'дизайнер','дизайнера','дизайнеров')}</div></div>`).join('');
  } else {
    if(!designerNames.length){ elNav.innerHTML='<div class="nav-empty">Нет дизайнеров</div>'; return; }
    elNav.innerHTML = designerNames.map((n,i)=>{
      const mc=meetingsOf(n);
      const crown = isTop(n) ? ' <span class="crown">'+CROWN+'</span>' : '';
      return `<div class="nav-item ${i===dIdx?'active':''}" onclick="selectDesigner(${i})">
        <div class="nav-main">${esc(n)}${crown}</div>
        <div class="nav-sub">${mc} ${plural(mc,'встреча','встречи','встреч')}</div></div>`;
    }).join('');
  }
}
function renderMain(){
  if(mode==='meetings'){
    const s=DATA.sessions[sIdx];
    if(!s){ elMain.innerHTML=emptyHTML(); return; }
    elMain.innerHTML = `<div class="session-header"><h1>Чеклист правок</h1></div>`
      + funHTML(s.fun)
      + (s.projects.map(p=>cardHTML(p,p.author)).join('') || emptyHTML());
  } else {
    const n=designerNames[dIdx];
    if(!n){ elMain.innerHTML=emptyHTML(); return; }
    const crownH = isTop(n) ? ' <span class="crown-h1">'+CROWN+'</span>' : '';
    const st = designerStatus(n);
    const badge = st ? `<div><span class="status-badge ${st.c}">${st.t}</span></div>` : '';
    elMain.innerHTML = `<div class="session-header"><h1>${esc(n)}${crownH}</h1>${badge}</div>`
      + DIDX[n].map(x=>cardHTML(x.project,x.dateLabel)).join('');
  }
}
// Шуточные номинации встречи. Показываем только то, что реально нашлось.
const FUN_KINDS = [
  ['weird_word',    'Странное слово'],
  ['catch_phrase',  'Частая фраза'],
  ['smart_comment', 'Умный комментарий'],
  ['filler_word',   'Топ-3 паразитов'],
];
// Иллюстрации рубрик из макета. Лежат прямо в разметке, чтобы страница

function funHTML(fun){
  if(!fun) return '';
  const cards = FUN_KINDS.map(([k,label])=>{
    const n = fun[k];
    if(!n) return '';
    // паразиты — это список топ-5, у остальных рубрик одна строка
    if(n.items && n.items.length){
      const rows = n.items.map(it=>`<div class="fun-row"><span class="fun-word">${esc(it.text)}</span>${it.count?`<span class="fun-num">${it.count} ${plural(it.count,'раз','раза','раз')}</span>`:''}</div>`).join('');
      // внизу — сколько паразитов прозвучало всего, включая те, что не в тройке
      const total = n.total ? `<div class="fun-total">${n.total} ${plural(n.total,'слово-паразит','слова-паразита','слов-паразитов')} за встречу</div>` : '';
      return `<div class="fun-card">
        <div class="fun-icon fun-icon-${k}">${FUN_ART[k]||''}</div>
        <div class="fun-label">${label}</div>
        <div class="fun-list">${rows}</div>
        ${total}
      </div>`;
    }
    if(!n.text) return '';
    // подпись внизу карточки: кто сказал и сколько раз это прозвучало за встречу
    const bits = [];
    if(n.author) bits.push(esc(n.author));
    if(n.count) bits.push(n.count+' '+plural(n.count,'раз','раза','раз')+' за встречу');
    const meta = bits.join(' · ');
    // длинную мысль показываем целиком, просто мельче — ничего не прячем
    const size = n.text.length > 220 ? 'longer' : (n.text.length > 90 ? 'long' : '');
    return `<div class="fun-card">
      <div class="fun-icon fun-icon-${k}">${FUN_ART[k]||''}</div>
      <div class="fun-label">${label}</div>
      <div class="fun-text ${size}">${esc(n.text)}</div>
      ${n.context ? `<div class="fun-context">«${esc(n.context)}»</div>` : ''}
      ${meta ? `<div class="fun-meta">${meta}</div>` : ''}
    </div>`;
  }).filter(Boolean);
  return cards.length ? `<div class="fun-grid">${cards.join('')}</div>` : '';
}
function render(){ renderNav(); renderMain(); }
function setMode(m){ if(mode===m) return; mode=m;
  document.getElementById('mb-meetings').classList.toggle('active', m==='meetings');
  document.getElementById('mb-designers').classList.toggle('active', m==='designers');
  render(); }
function selectSession(i){ sIdx=i; render(); }
function selectDesigner(i){ dIdx=i; render(); }
function toggleProj(id){ const el=document.getElementById('proj-'+id); if(el) el.classList.toggle('collapsed'); }
function toggleTask(taskId,projId){
  state[taskId]=!state[taskId]; save();
  const te=document.getElementById('task-'+taskId); if(te) te.classList.toggle('checked', state[taskId]);
  const p=projById[projId]; if(p){ const done=countDone(p.tasks), total=p.tasks.length;
    const ce=document.getElementById('count-'+projId); if(ce){ ce.textContent=done+'/'+total; ce.className='count'+(done===total&&total>0?' done':''); } }
}
function resetCurrent(){
  if(!confirm('Сбросить все отметки в этом разделе?')) return;
  let tasks=[];
  if(mode==='meetings'){ const s=DATA.sessions[sIdx]; if(s) s.projects.forEach(p=>tasks.push(...p.tasks)); }
  else { const n=designerNames[dIdx]; (DIDX[n]||[]).forEach(x=>tasks.push(...x.project.tasks)); }
  tasks.forEach(t=> delete state[t.id]); save(); renderMain();
}
render();
