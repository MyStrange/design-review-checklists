name: Send silent message

# Отправляет текст из trigger/send.txt в группу БЕЗ звука (disable_notification)
# и сохраняет message_id в data/sent_messages.json (чтобы потом можно было
# отредактировать это сообщение по id, без всяких ответов в чате).
on:
  push:
    paths:
      - "trigger/send.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Отправить тихо
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.notify --send-silent
      - name: Сохранить message_id в репозиторий
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/sent_messages.json
          if git diff --cached --quiet; then
            echo "Журнал не изменился."
          else
            git commit -m "Журнал отправленных сообщений (message_id)"
            git push
          fi
