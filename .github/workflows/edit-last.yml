name: Edit last bot message

# Редактирует ПОСЛЕДНИЙ пост-чеклист бота по сохранённому message_id из журнала
# (data/sent_messages.json) — ничего отвечать в чате не нужно.
# Как запустить: положить новый текст в trigger/edit-last.txt и запушить.
on:
  push:
    paths:
      - "trigger/edit-last.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Отредактировать прошлый пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.notify --edit-last
      - name: Зафиксировать факт правки в журнале
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/sent_messages.json
          if git diff --cached --quiet; then
            echo "Журнал не изменился (правка не прошла?)."
          else
            git commit -m "Журнал: отредактировано сообщение бота"
            git push
          fi
