name: Send pending (morning)

# Рассылает уведомления, отложенные прогоном вне рабочего окна: конспект разобран
# в выходной, раньше 10:00 или позже 18:00 МСК — тогда его не шлют сразу, а
# кладут в очередь. В рабочее время шлём со звуком и тегами.
#
# Только будни: в субботу и воскресенье пушей не шлём вовсе, очередь ждёт
# понедельника (это же правило живёт в notify.is_quiet_now).
#
# Точек расписания три, и все раньше нужного времени, потому что GitHub
# привозит запланированные запуски с опозданием на 4–8 часов: запрошенный на
# 07:05 UTC прогон приезжал в 14:00–17:20 UTC, то есть уже после 18:00 МСК — и
# очередь не разбиралась вовсе. Промахнулся один запуск — выручит следующий.
# Очередь, кроме того, разбирает любой прогон sync.yml, попавший в рабочее окно.
# Если очередь пуста — прогон ничего не делает.
on:
  schedule:
    - cron: "5 4 * * 1-5"   # 07:05 МСК
    - cron: "5 7 * * 1-5"   # 10:05 МСК
    - cron: "5 10 * * 1-5"  # 13:05 МСК
  workflow_dispatch: {}
  # ручной разовый запуск: положить/изменить trigger/send-pending.txt и запушить
  push:
    paths:
      - "trigger/send-pending.txt"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  send-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Разослать отложенное
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_BOT_TOKEN: ${{ secrets.YANDEX_BOT_TOKEN }}
          YANDEX_BOT_CHAT_ID: ${{ secrets.YANDEX_BOT_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python -m src.main --send-pending
      - name: Сохранить очищенную очередь и журнал
        if: always()
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/checklists.json data/sent_messages.json
          if git diff --cached --quiet; then
            echo "Очередь пуста — отправлять было нечего."
          else
            git commit -m "Разосланы отложенные уведомления, очередь очищена"
            # в main могли запушить, пока шёл прогон: подбираем чужие коммиты,
            # иначе отправленное останется неотмеченным и уйдёт второй раз
            for i in 1 2 3; do
              git push && break
              echo "Пуш отклонён, подтягиваю main и пробую снова ($i)"
              git pull --rebase origin main || exit 1
              sleep 3
            done
          fi
