name: Send pending (morning)

# Рассылает уведомления, отложенные с вечера (конспект пришёл после 18:00 МСК —
# его не слали вечером, а положили в очередь). Утром шлём со звуком и тегами.
# Запуск каждый день в 10:05 МСК (07:05 UTC). Если очередь пуста — ничего не делает.
on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch: {}
  # ручной разовый запуск: положить/изменить trigger/send-pending.txt и запушить
  push:
    paths:
      - "trigger/send-pending.txt"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  send-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Разослать отложенное
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_BOT_TOKEN: ${{ secrets.YANDEX_BOT_TOKEN }}
          YANDEX_BOT_CHAT_ID: ${{ secrets.YANDEX_BOT_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python -m src.main --send-pending
      - name: Сохранить очищенную очередь и журнал
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/checklists.json data/sent_messages.json
          if git diff --cached --quiet; then
            echo "Очередь пуста — отправлять было нечего."
          else
            git commit -m "Разосланы отложенные уведомления, очередь очищена"
            git push
          fi
