name: Добрать рубрики встреч

# Разовая починка: если у уже разобранной встречи рубрик меньше четырёх,
# берём её письмо из ящика и спрашиваем модель ТОЛЬКО про недостающие.
# Чек-листы, отметки и уведомления не трогаются — меняется только блок fun.
# Встречи старше SEARCH_SINCE_DAYS пропускаются: их писем в ящике уже не найти.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Пересобрать рубрики заново, даже там, где они уже есть"
        type: boolean
        default: false
      model:
        description: "Модель Gemini: пусто — как обычно, flash-lite — когда кончилась суточная квота"
        type: string
        default: ""
  # ручной разовый запуск: изменить trigger/refill-fun.txt и запушить
  push:
    paths:
      - "trigger/refill-fun.txt"

permissions:
  contents: write

concurrency:
  group: sync          # вместе с обычным прогоном почты, чтобы не толкаться за data
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Добрать недостающие рубрики
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || 'gemini-2.5-flash' }}
        run: python -m src.main --refill-fun ${{ inputs.force && '--force' || '' }}

      - name: Закоммитить изменения
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/checklists.json docs/
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Добраны рубрики встреч ($(date -u +%Y-%m-%d_%H:%M)Z)"
            # пока шёл прогон, в main могли запушить — подбираем чужие коммиты
            # и пробуем ещё раз, иначе работа прогона пропадёт
            for i in 1 2 3; do
              git push && break
              echo "Пуш отклонён, подтягиваю main и пробую снова ($i)"
              git pull --rebase origin main || exit 1
              sleep 3
            done
          fi
