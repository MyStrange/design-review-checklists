name: Announce

# Ручной запуск: отправляет анонс-сообщение в группу (с HTML-ссылкой).
on:
  workflow_dispatch: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Анонс
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.notify --announce
