name: Sync design-review checklists

# Дни ревью: вторник (ч.1, 14:00–15:00 МСК) и четверг (ч.2, 16:00–17:00 МСК).
#
# КОГДА ПРИХОДИТ КОНСПЕКТ — заранее не известно. По логам прошлых встреч:
#   29.10 — в пределах ~5 часов после встречи;
#   10.11 — в тот же вечер, до 02:40 МСК;
#   12.11 — ночью, между 02:44 и 04:29 МСК;
#   05.11 — позже 04:08 МСК СЛЕДУЮЩЕГО дня.
# То есть «ждать 15 минут после встречи» не работает, и угадать точку в
# расписании нельзя.
#
# ПОЧЕМУ ТОЧЕК РАСПИСАНИЯ ВСЁ РАВНО МАЛО. Раньше тут стояла сетка «каждые 15
# минут в широком окне» — 32 запуска в день ревью. По факту GitHub на бесплатном
# плане запускает из них 1–3, и с опозданием на 4–8 часов (ежедневный
# morning-send, запрошенный на 07:05 UTC, приезжает в 14:00–17:20 UTC).
# Пропущенные события он не копит, так что частая сетка надёжности не добавляет:
# 12 ноября случилась одна проверка из 32, уже ночью.
#
# ПОЭТОМУ НАДЁЖНОСТЬ ДЕРЖИТСЯ НЕ НА ЧАСТОТЕ, А НА ДВУХ ВЕЩАХ:
#   1) в день ревью прогон ждёт письмо сам — --watch перепроверяет почту каждые
#      10 минут 5 часов подряд и заканчивает, как только разобрал;
#   2) ежедневный проход подбирает всё, что приехало мимо: письмо никуда не
#      девается (лежит в ящике 45 дней, разобранные помечены по UID), поэтому
#      худший случай — чек-лист появится на сайте утром следующего дня, а пуш
#      уйдёт в ближайшее рабочее окно (будни 10:00–18:00 МСК).
# Без ежедневного прохода встречи наслаивались: 10 ноября в 02:44 МСК ушли сразу
# два чек-листа, за 5 и за 10 ноября.
on:
  schedule:
    - cron: "40 11 * * 2"   # вт 14:40 МСК — к концу встречи ч.1, дальше ждём 5 ч
    - cron: "40 13 * * 4"   # чт 16:40 МСК — к концу встречи ч.2, дальше ждём 5 ч
    - cron: "10 3 * * *"    # 06:10 МСК — ночной улов: что пришло после полуночи
    - cron: "10 6 * * *"    # 09:10 МСК — утренний догон, он же страховка от
                            #             опозданий планировщика
  workflow_dispatch:
    inputs:
      watch:
        description: "Сколько минут перепроверять почту (0 — один проход)"
        default: "0"
  # ручной разовый запуск: положить/изменить trigger/run-sync.txt и запушить
  push:
    paths:
      - "trigger/run-sync.txt"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # с запасом на --watch (5 ч) и на долгие ретраи перегруженной модели
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сколько ждать письмо
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_WATCH: ${{ github.event.inputs.watch }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "minutes=${INPUT_WATCH:-0}" >> "$GITHUB_OUTPUT"   # ручной запуск
          else
            case "$SCHEDULE" in
              # день ревью: ждём письмо, перепроверяя почту каждые 10 минут
              "40 11 * * 2"|"40 13 * * 4") echo "minutes=300" ;;
              # ежедневный проход: письмо либо уже лежит, либо ждём до следующего
              *) echo "minutes=0" ;;
            esac >> "$GITHUB_OUTPUT"
          fi

      - name: Забрать почту, разобрать, собрать страницу
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_BOT_TOKEN: ${{ secrets.YANDEX_BOT_TOKEN }}
          YANDEX_BOT_CHAT_ID: ${{ secrets.YANDEX_BOT_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # необязательные переопределения:
          # GEMINI_MODEL, GEMINI_MODEL_FALLBACK, LLM_PROVIDER, REVIEW_SENDER,
          # SUBJECT_MUST_CONTAIN
        run: python -m src.main --watch ${{ steps.mode.outputs.minutes }}

      # if: always() — главное: даже если разбор упал (перегружена модель,
      # оборвалась почта), уже сделанная работа должна доехать до репозитория.
      # Раньше падение уносило весь прогон вместе с разобранными встречами.
      - name: Закоммитить изменения
        if: always()
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/checklists.json data/sent_messages.json docs/
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновление чек-листов ($(date -u +%Y-%m-%d_%H:%M)Z)"
            # пока шёл прогон, в main могли запушить — подбираем чужие коммиты
            # и пробуем ещё раз, иначе работа прогона пропадёт
            for i in 1 2 3; do
              git push && break
              echo "Пуш отклонён, подтягиваю main и пробую снова ($i)"
              git pull --rebase origin main || exit 1
              sleep 3
            done
          fi
