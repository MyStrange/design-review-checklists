name: Sync design-review checklists

# Дни ревью: вторник (ч.1, 14:00–15:00 МСК) и четверг (ч.2, 16:00–17:00 МСК).
# Конспект приходит через 10–15 мин после конца встречи, но встреча может
# сильно затянуться. Поэтому проверяем каждые 30 минут от планового конца
# и до позднего вечера. Время в cron — UTC (МСК = UTC+3).
# Если встречу отменили и письма нет — прогон просто ничего не находит и не делает.
on:
  schedule:
    # вторник: 12:00–19:30 UTC = 15:00–22:30 МСК
    - cron: "*/30 12-19 * * 2"
    # четверг: 14:00–20:30 UTC = 17:00–23:30 МСК
    - cron: "*/30 14-20 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Забрать почту, разобрать, собрать страницу
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_BOT_TOKEN: ${{ secrets.YANDEX_BOT_TOKEN }}
          YANDEX_BOT_CHAT_ID: ${{ secrets.YANDEX_BOT_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # необязательные переопределения:
          # GEMINI_MODEL, LLM_PROVIDER, REVIEW_SENDER, SUBJECT_MUST_CONTAIN
        run: python -m src.main

      - name: Закоммитить изменения
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/checklists.json data/sent_messages.json docs/
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновление чек-листов ($(date -u +%Y-%m-%d_%H:%M)Z)"
            git push
          fi
