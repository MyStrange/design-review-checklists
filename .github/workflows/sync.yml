name: Sync design-review checklists

# Дни ревью: вторник (ч.1, 14:00–15:00 МСК) и четверг (ч.2, 16:00–17:00 МСК).
# Конспект приходит через 10–15 мин после конца встречи, но встреча может
# сильно затянуться. Проверяем КАЖДЫЕ 15 МИНУТ в широком окне — так даже если
# GitHub задержит/пропустит один запуск (бесплатный cron у него «по возможности»),
# следующий через 15 мин подхватит. Минуты НЕкруглые (3/18/33/48) — на :00 и :30
# планировщик GitHub самый загруженный и чаще пропускает. Время в cron — UTC (МСК = UTC+3).
# Письма нет (встречу отменили/ещё не пришло) — прогон тихо ничего не делает.
on:
  schedule:
    # вторник: 11:03–19:48 UTC = 14:03–22:48 МСК
    - cron: "3,18,33,48 11-19 * * 2"
    # четверг: 13:03–20:48 UTC = 16:03–23:48 МСК
    - cron: "3,18,33,48 13-20 * * 4"
  workflow_dispatch: {}
  # ручной разовый запуск: положить/изменить trigger/run-sync.txt и запушить
  push:
    paths:
      - "trigger/run-sync.txt"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Забрать почту, разобрать, собрать страницу
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_BOT_TOKEN: ${{ secrets.YANDEX_BOT_TOKEN }}
          YANDEX_BOT_CHAT_ID: ${{ secrets.YANDEX_BOT_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # необязательные переопределения:
          # GEMINI_MODEL, LLM_PROVIDER, REVIEW_SENDER, SUBJECT_MUST_CONTAIN
        run: python -m src.main

      - name: Закоммитить изменения
        run: |
          git config user.name "MyStrange"
          git config user.email "18186386+MyStrange@users.noreply.github.com"
          git add data/checklists.json data/sent_messages.json docs/
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновление чек-листов ($(date -u +%Y-%m-%d_%H:%M)Z)"
            git push
          fi
